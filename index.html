<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HCI MCQ Practice</title>
<style>
:root{--bg:#12131c;--panel:#1b1d2a;--panel2:#242738;--line:#33374d;--tx:#e9e7f2;--mut:#9a9db5;--acc:#6cc7e8;--ok:#6fe3a8;--bad:#ff7084;--warn:#f2c26b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(1200px 600px at 80% -10%,#232647 0,transparent 60%),var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
h1{font:600 clamp(26px,5vw,38px)/1.15 Georgia,"Iowan Old Style",serif;margin:8px 0 6px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.secs{display:grid;gap:10px;margin:14px 0}
.sec{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;transition:transform .15s,border-color .15s,background .15s;text-align:left;color:var(--tx);font:inherit;width:100%}
.sec:hover{transform:translateX(4px);border-color:var(--acc)}
.sec.on{border-color:var(--acc);background:#1d2b3a}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:.2s}
.sec.on .box{background:var(--acc);border-color:var(--acc)}
.sec.on .box:after{content:"";width:6px;height:11px;border:solid #0b1620;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.sec b{font-weight:600}.sec small{margin-left:auto;color:var(--mut);white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--panel);color:var(--mut);border:0;padding:9px 14px;font:inherit;cursor:pointer}
.seg button.on{background:var(--acc);color:#0b1620;font-weight:600}
label.n{color:var(--mut);display:flex;gap:8px;align-items:center}
input[type=number]{width:70px;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
.btn{background:var(--acc);color:#0b1620;border:0;border-radius:12px;padding:12px 22px;font:600 16px system-ui;cursor:pointer;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.link{background:none;border:0;color:var(--acc);cursor:pointer;font:inherit;padding:4px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar{flex:1;height:8px;background:var(--panel2);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));border-radius:8px;transition:width .5s cubic-bezier(.2,.9,.2,1)}
.meta{color:var(--mut);font-size:14px;white-space:nowrap}
.tag{display:inline-block;color:var(--acc);font-size:13px;margin-bottom:8px}
.q{font:500 clamp(19px,3.6vw,23px)/1.4 Georgia,"Iowan Old Style",serif;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--panel);color:var(--tx);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;cursor:pointer;transition:transform .15s,border-color .15s,background .25s}
.opt:not(:disabled):hover{border-color:var(--acc);transform:translateX(4px)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--mut);transition:.25s}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:#173528;animation:pop .45s}
.opt.ok .l{background:var(--ok);color:#06210f}
.opt.bad{border-color:var(--bad);background:#3a1a24;animation:shake .45s}
.opt.bad .l{background:var(--bad);color:#2a0710}
.opt.dim{opacity:.55}
.opt .why{display:block;margin-top:6px;font-size:14px;color:var(--mut)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.exp{margin-top:16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);padding:16px;animation:rise .4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.verdict{font-weight:700;font-size:18px;margin:0 0 8px}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.exp h3{margin:12px 0 4px;font-size:14px;color:var(--warn)}.exp p{margin:0}
.ref{color:var(--mut);font-size:13px;margin-top:12px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.hint{color:var(--mut);font-size:13px;margin-top:14px}
.ring{width:170px;height:170px;margin:6px auto 4px;position:relative}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .t{stroke:var(--panel2)}.ring .f{stroke:var(--acc);stroke-dasharray:439.8;stroke-dashoffset:439.8;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.9,.2,1)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font:700 38px Georgia,serif}
.res{text-align:center}.res p{color:var(--mut);margin:4px 0 16px}
.brk{text-align:left;display:grid;gap:8px;margin:16px 0}
.brk div{display:flex;gap:10px;align-items:center;font-size:14px}.brk span{width:46%;min-width:120px}
.brk .b{flex:1;height:7px;background:var(--panel2);border-radius:6px;overflow:hidden}.brk .b i{display:block;height:100%;background:var(--ok);width:0;transition:width 1s .3s}
.brk em{font-style:normal;color:var(--mut);width:48px;text-align:right}
button:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="wrap" id="app"></div>
<script>
const DATA=[{"s": "Cognitive Aspects", "q": "Which of the following is FALSE regarding divided attention?", "o": ["It allows a person to perform simultaneous tasks they are paying focused attention to.", "Listening and watching use different perceptual channels, making them easier to combine.", "Heavy multitaskers are generally better at filtering out irrelevant information than light multitaskers.", "Reading scrolling news headlines while watching TV is difficult because both are intensive visual sources."], "a": 2, "r": "The slides state heavy multitaskers are more prone to being distracted and find it difficult to filter irrelevant information.", "w": "A, B, and D are all true statements directly supported by the divided attention and multitasking slides.", "f": "Cognitive Aspects, Slides 13-15 (Divided Attention & Multitasking)"}, {"s": "Cognitive Aspects", "q": "Regarding human memory, which statement is FALSE?", "o": ["Short-term memory (STM) can hold more information if organized into meaningful \"chunks\".", "Long-term memory (LTM) retrieval is generally faster than STM access.", "Graphical interfaces support recognition memory, which is easier than recall.", "Context affects the extent to which information can be subsequently retrieved from memory."], "a": 1, "r": "The slides explicitly state LTM retrieval is relatively slow compared to STM and can fail if cues are missing.", "w": "A is true (chunking). C is true (menus/icons support recognition). D is true (context affects retrieval, e.g., seeing a neighbor out of context).", "f": "Cognitive Aspects, Slides 34-37 (Memory Processing & Context)"}, {"s": "Cognitive Aspects", "q": "The classic \"7 ± 2\" memory phenomenon is often misapplied in interface design because:", "o": ["People cannot scan lists of more than 7 items.", "People can scan lists of bullets or menus for the one they want, so they don't have to recall them from memory.", "STM capacity is actually unlimited if the user is highly trained.", "Interfaces should never have more than 7 tabs or menu items under any circumstance."], "a": 1, "r": "The slides clarify that scanning a list relies on recognition, not recall, so interfaces can have more than 9 items (e.g., browser history).", "w": "A is false (people can scan longer lists). C is false (STM is strictly limited). D is false (it depends on the task and screen estate).", "f": "Cognitive Aspects, Slides 39-41 (The 7±2 Problem)"}, {"s": "Cognitive Aspects", "q": "Which of the following is NOT a typical characteristic of users' mental models?", "o": ["They are often incomplete.", "They are often unscientific.", "They are always perfectly aligned with the designer’s conceptual model.", "They are often mentally parsimonious (lazy), leading users to do extra physical operations to avoid mental planning."], "a": 2, "r": "The slides state the two models don’t always match, and it is hard to get them to match for all users.", "w": "A, B, and D are all explicitly listed as characteristics of mental models in the slides.", "f": "Cognitive Aspects, Slides 74-75 (Erroneous Mental Models)"}, {"s": "Cognitive Aspects", "q": "The \"Gulf of Execution\" refers to:", "o": ["The mental distance from the physical system to the user.", "The quality of communication from the system to the user.", "The mental distance from the user to the physical system (how hard it is to get the system to do the task).", "The process of externally manipulating items into different orders."], "a": 2, "r": "The Gulf of Execution is defined as the mental distance from the user to the system (how hard it is to execute the task).", "w": "A and B describe the Gulf of Evaluation. D describes cognitive tracing.", "f": "Cognitive Aspects, Slides 85-87 (Gulfs of Execution and Evaluation)"}, {"s": "Cognitive Aspects", "q": "A major limitation of the Human Information Processing System (HIPS) model is that it:", "o": ["Accounts too much for how people interact with other people.", "Models mental activities as happening exclusively inside the head of ONE person at a time.", "Is the most modern and widely used model in current HCI wild studies.", "Focuses primarily on distributed cognition across artifacts."], "a": 1, "r": "The slides explicitly list this as the primary limitation; it ignores real-world interactions with devices, objects, and other people.", "w": "A is the opposite of the truth. C is false (it is rarely used now, superseded by contextual models). D describes Distributed Cognition, not HIPS. Ref: Cognitive Aspects, Slides 92-93 (Limitations of HIPS Model)", "f": "Cognitive Aspects, Slides 92-93 (Limitations of HIPS Model)"}, {"s": "Cognitive Aspects", "q": "Distributed cognition differs from traditional information processing models because it:", "o": ["Focuses only on internal mental representations.", "Is concerned with cognitive phenomena across individuals, artifacts, and internal/external representations.", "Assumes the mind works exactly like a digital computer with ordered processing stages.", "Ignores the role of verbal and non-verbal behavior in collaborative activities."], "a": 1, "r": "Distributed cognition is defined as collective thinking concerned with phenomena across individuals, artifacts, and representations (Hutchins, 1995).", "w": "A and C describe the older HIPS/information processing model. D is false; distributed cognition specifically studies verbal/non-verbal communication (e.g., ATC case study).", "f": "Cognitive Aspects, Slides 94-98 (Distributed Cognition)"}, {"s": "Cognitive Aspects", "q": "Which of the following is the BEST example of \"computational offloading\"?", "o": ["Using a post-it note to remind yourself to buy milk.", "Using pen and paper to carry out a complex multiplication sum instead of doing it in your head.", "Sorting a deck of cards by suit.", "Underlining key terms in a textbook."], "a": 1, "r": "Computational offloading is specifically defined as using a tool with an external representation to carry out a computation (e.g., pen and paper for math).", "w": "A is cognitive offloading (reminding). C and D are examples of cognitive tracing and annotation, respectively.", "f": "Cognitive Aspects, Slides 101-103 (Computational Offloading)"}, {"s": "Cognitive Aspects", "q": "When a user assumes a thermostat works like a gas pedal (turning it to the maximum to heat a room faster), this is an example of:", "o": ["A scientifically accurate mental model.", "The \"general valve theory\" or \"more is more\" principle, which is an erroneous mental model for thermostats.", "Successful bridging of the Gulf of Evaluation.", "Top-down processing based on perfect system knowledge."], "a": 1, "r": "The slides explicitly use the thermostat/gas pedal analogy to describe an erroneous mental model based on the \"more is more\" generalization.", "w": "A is false (thermostats are on-off switches, not valves). C and D are unrelated to this specific cognitive error.", "f": "Cognitive Aspects, Slide 73 (Everyday Reasoning and Mental Models)"}, {"s": "Cognitive Aspects", "q": "If a system provides no feedback after a user clicks a \"Submit\" button, it primarily widens the:", "o": ["Gulf of Execution", "Gulf of Evaluation", "Short-Term Memory capacity", "Distributed cognition network"], "a": 1, "r": "The Gulf of Evaluation is the distance from the system to the user (quality of communication/feedback). No feedback makes it hard to evaluate what the system did.", "w": "A is about the user figuring out how to do the task. C and D are unrelated to system feedback.", "f": "Cognitive Aspects, Slides 87-88 (Gulfs of Execution and Evaluation)"}, {"s": "Cognitive Aspects", "q": "In visual perception, \"bottom-up\" processing refers to:", "o": ["Processing that begins with the observer’s expectations and prior knowledge.", "Processing that begins with raw sensory data and feeds up toward the brain.", "The tendency to perceive missing parts of a figure to complete it.", "The active construction of meaning based on cultural context."], "a": 1, "r": "Bottom-up processing is explicitly defined as beginning with raw sensory data and feeding up to the brain.", "w": "A describes top-down processing. C describes the Gestalt principle of closure. D is related to top-down/contextual perception.", "f": "Cognitive Aspects / Human Vision, Slide 40 (Top Down vs Bottom Up Processing)"}, {"s": "Cognitive Aspects", "q": "Which design implication is MOST appropriate for managing user attention limits?", "o": ["Use as many flashing lights and pop-ups as possible to ensure the user sees everything.", "Avoid cluttering the interface and make information salient only when it needs attending to.", "Force users to read scrolling tickers while listening to audio to train their divided attention.", "Hide all system status information to prevent overwhelming the user."], "a": 1, "r": "The slides state designers should make information salient (using color, spacing, etc.) but avoid cluttering and avoid overusing attention-grabbing methods.", "w": "A is false (overuse leads to being ignored). C is false (it overloads capacity). D is false (system status should be visible, just not overwhelming).", "f": "Cognitive Aspects, Slides 20-21, 32 (Design Implications for Attention)"}, {"s": "Cognitive Aspects", "q": "\"Cognitive tracing\" involves:", "o": ["Modifying existing representations through making marks (e.g., crossing off).", "Externally manipulating items into different orders or structures (e.g., sorting papers, playing Scrabble).", "Using a calculator to perform a complex mathematical operation.", "Relying on a wearable camera to intermittently take photos."], "a": 1, "r": "Cognitive tracing is defined as externally manipulating items into different orders/structures.", "w": "A is annotation. C is computational offloading. D is a memory aid (SenseCam).", "f": "Cognitive Aspects, Slide 103 (Annotation and Cognitive Tracing)"}, {"s": "Cognitive Aspects", "q": "Episodic long-term memory is best described as:", "o": ["Learned knowledge organized like an interconnected graph or network.", "A temporary scratchpad holding 7 ± 2 items.", "An ongoing videotape that records everything you do, organized by time and events.", "The ability to recall a small amount of information from a recent time period."], "a": 2, "r": "Episodic LTM is explicitly described as an \"ongoing videotape\" organized by time and events.", "w": "A describes Semantic LTM. B describes STM. D describes Working/Intermediate-term memory.", "f": "Cognitive Aspects / Human Abilities, Slide 49 (Two types of LTM)"}, {"s": "Cognitive Aspects", "q": "According to the slides, why is reading scrolling news headlines while watching a TV broadcast particularly difficult?", "o": ["Because rods cannot detect the motion of the scrolling text.", "Because reading is a complex activity that translates symbols to words, interrupting the auditory channel of listening.", "Because the fovea can only process one color at a time.", "Because scrolling text relies on top-down processing, which is slow."], "a": 1, "r": "The slides explain that reading recreates a \"reading voice in the head,\" which interrupts listening, making it hard to combine with another intensive source.", "w": "A is false (rods detect motion well). C is false (fovea detects color and detail). D is inaccurate in this context.", "f": "Cognitive Aspects, Slide 14 (Reading scrolling news headlines)"}, {"s": "Cognitive Aspects", "q": "A user knows what they want to do but cannot figure out which button to press to achieve it. They are struggling with the:", "o": ["Gulf of Evaluation", "Gulf of Execution", "Gulf of External Cognition", "Gulf of Distributed Processing"], "a": 1, "r": "The Gulf of Execution is the mental distance from the user to the system (figuring out how to execute the intended task).", "w": "A is about understanding what the system did after the action. C and D are made-up distractors.", "f": "Cognitive Aspects, Slides 85-87 (Gulfs of Execution and Evaluation)"}, {"s": "Cognitive Aspects", "q": "Which of the following is NOT considered a core cognitive process in HCI?", "o": ["Attention", "Perception", "Digestion", "Problem-solving"], "a": 2, "r": "Digestion is a biological/physiological process, not a cognitive process. The core cognitive processes listed are attention, perception, memory, learning, reading/speaking/listening, and problem-solving.", "w": "A, B, and D are all explicitly listed as core cognitive processes. Ref: Cognitive Aspects, Slide 6 (Cognitive Processes)", "f": "Cognitive Aspects, Slide 6 (Cognitive Processes)"}, {"s": "Cognitive Aspects", "q": "Designers can help foster better mental models by doing all of the following EXCEPT:", "o": ["Providing clear and easy-to-use instructions.", "Using good metaphors (e.g., folders for directories).", "Hiding system functionality to reduce cognitive load.", "Providing transparency to show what the system is doing."], "a": 2, "r": "Hiding functionality prevents users from building accurate mental models. The slides emphasize transparency and making parts/processes visible.", "w": "A, B, and D are all explicitly listed as ways to foster better mental models. to build better mental models)", "f": ""}, {"s": "Cognitive Aspects", "q": "The phenomenon where people remember less about objects they have photographed compared to observing them with the naked eye highlights the importance of:", "o": ["Encoding and active attention during memory processing.", "The unlimited capacity of Long-Term Memory.", "The superiority of recall over recognition.", "Bottom-up sensory decay."], "a": 0, "r": "The slides note this phenomenon to show that we don't remember everything; it involves filtering and processing what is attended to. Taking a photo reduces active encoding.", "w": "B is false (LTM is large, but retrieval fails without encoding). C is false (recognition is easier than recall). D is unrelated to this specific memory phenomenon.", "f": "Cognitive Aspects, Slide 34 (Memory)"}, {"s": "Cognitive Aspects", "q": "In UI design, yellow text on a white background is considered poor practice primarily because:", "o": ["It causes seizures in epileptic users.", "It lacks sufficient color contrast, making it hard to perceive.", "Yellow is a color that rods cannot detect.", "It violates the Gestalt principle of closure."], "a": 1, "r": "The slides explicitly state: \"Yellow on green or white is a no-no\" due to poor perceptual contrast.", "w": "A is related to rapid blinking (15-20Hz), not static yellow/white. C is irrelevant (cones detect color). D is unrelated to color contrast.", "f": "Cognitive Aspects, Slide 47 (Design Implications for Perception)"}, {"s": "Cognitive Aspects", "q": "Experiential cognition is to reflective cognition as:", "o": ["Slow thinking is to fast thinking.", "Fast thinking (e.g., 2+2=4) is to slow thinking (e.g., 21x29).", "Long-term memory is to short-term memory.", "Top-down processing is to bottom-up processing."], "a": 1, "r": "The slides link experiential cognition to fast, automatic thinking, and reflective cognition to slow, conscious problem-solving (Kahneman, 2011).", "w": "A has the order reversed. C and D are different cognitive concepts not directly analogous to this specific pairing.", "f": "Cognitive Aspects, Slide 3 (What is Cognition?)"}, {"s": "Cognitive Aspects", "q": "Semantic long-term memory is organized as:", "o": ["An ongoing videotape indexed by time.", "A temporary scratchpad for current tasks.", "An interconnected graph or network of related facts, concepts, and skills.", "A series of perceptual buffers that decay in 70-1000 ms."], "a": 2, "r": "Semantic LTM is explicitly defined as learned knowledge organized like an interconnected graph or network.", "w": "A describes Episodic LTM. B describes STM. D describes Perceptual buffers.", "f": "Cognitive Aspects / Human Abilities, Slide 50 (Semantic LTM)"}, {"s": "Cognitive Aspects", "q": "According to Pavio’s dual coding theorem, learning is enhanced when:", "o": ["Information comes from complementary visual and auditory sources.", "Users are forced to rely solely on textual manuals.", "The interface uses only monochromatic color schemes.", "Heavy multitasking is encouraged during the learning process."], "a": 0, "r": "The slides state that learning is enhanced when info comes from complementary visual and auditory sources (e.g., animation with narration).", "w": "B, C, and D are all contradicted by HCI design principles for learning and attention.", "f": "Cognitive Aspects, Slide 15 (Listening and watching use different perceptual channels)"}, {"s": "Cognitive Aspects", "q": "\"Annotation\" involves modifying existing representations through making marks. Which of the following is an example of annotation?", "o": ["Sorting a pile of manual records into alphabetical order.", "Crossing off, ticking, or underlining items on a printed list.", "Using a calculator to solve a math problem.", "Moving chess pieces to plan a future move."], "a": 1, "r": "Annotation is explicitly defined as modifying existing representations by making marks (crossing off, ticking, underlining).", "w": "A and D are examples of cognitive tracing. C is computational offloading.", "f": "Cognitive Aspects, Slide 103 (Annotation and Cognitive Tracing)"}, {"s": "Cognitive Aspects", "q": "A conceptual model is to a mental model as:", "o": ["What the user actually thinks is to what the designer wants the user to think.", "What the designer wants the user to think is to what the user actually thinks.", "The Gulf of Execution is to the Gulf of Evaluation.", "Bottom-up processing is to top-down processing."], "a": 1, "r": "The slides explicitly state: \"Conceptual model is what the designer wants the user to think... The mental model is what the user actually thinks.\"", "w": "A has the definitions reversed. C and D are unrelated cognitive concepts.", "f": "Cognitive Aspects, Slide 80 (Relationship between Mental and Conceptual Models)"}, {"s": "Cognitive Aspects", "q": "Which of the following stimuli is LEAST likely to sustain selective attention over time?", "o": ["A sudden, loud noise.", "A flashing light or pop-up that is constantly overused.", "A user's own name being called.", "A highly relevant task-specific alert."], "a": 1, "r": "The slides state that while sudden movements or flashing lights can grab attention, \"if overused, even these can be ignored.\"", "w": "A, C, and D are all listed as effective stimuli for grabbing selective attention (when used appropriately).", "f": "Cognitive Aspects, Slide 8 (Attention)"}, {"s": "Cognitive Aspects", "q": "The fovea is responsible for:", "o": ["Detecting light levels in very low light conditions.", "Detecting fine details and color, but only covering about 1 to 5 degrees of the visual field.", "Detecting motion changes across a wide 25-degree field of view.", "Storing visual information in the perceptual buffer for up to 3.5 seconds."], "a": 1, "r": "The slides state the fovea is in the center of the retina, concentrated with cones, detecting details and color, but only covers about 1 degree (up to 5 degrees for reading focus).", "w": "A and C describe the function of rods. D describes the auditory buffer (visual buffer decays in 70-1000 ms).", "f": "Cognitive Aspects / Human Vision, Slides 10-11 (The Eye, Retina and Fovea)"}, {"s": "Cognitive Aspects", "q": "In the Air Traffic Control case study, the use of paper flight strips alongside computer systems is a classic example of:", "o": ["The HIPS model in action.", "Distributed cognition, where information is transformed across different media (heads, paper, computers).", "A failure of top-down processing.", "An erroneous mental model held by the controllers."], "a": 1, "r": "The ATC case study is the primary example used in the slides to illustrate distributed cognition across individuals and artifacts (paper strips).", "w": "A is false (HIPS is an individual, internal model). C and D are not the focus of this case study.", "f": "Cognitive Aspects, Slides 96-98 (Air Traffic Control Case Study)"}, {"s": "Cognitive Aspects", "q": "Heavy multitaskers are often more prone to errors because they:", "o": ["Have a larger Short-Term Memory capacity than light multitaskers.", "Find it difficult to filter irrelevant information and are easily distracted.", "Rely too heavily on recognition rather than recall.", "Possess highly developed, scientific mental models."], "a": 1, "r": "The slides cite Ophir et al. (2009), stating heavy multitaskers were more prone to being distracted and found it difficult to filter irrelevant information.", "w": "A is false (STM capacity is fixed). C and D are unrelated to the multitasking studies cited.", "f": "Cognitive Aspects, Slide 24 (Multitasking and Attention)"}, {"s": "Cognitive Aspects", "q": "Which of the following is FALSE regarding the \"7 ± 2\" memory phenomenon in interface design?", "o": ["It has been applied in interaction design when considering how many options to display.", "Designers should strictly never present more than 7 icons on a toolbar.", "People can scan lists of bullets or tabs, so they don't have to recall them from memory.", "The number of items at an interface can exceed 9 depending on the task and screen estate."], "a": 1, "r": "The slides explicitly argue against strictly limiting interfaces to 7 items, because scanning relies on recognition, not recall.", "w": "A, C, and D are all true statements made in the slides to debunk the strict application of the 7±2 rule.", "f": "Cognitive Aspects, Slides 39-41 (The 7±2 Problem)"}, {"s": "Cognitive Aspects", "q": "Context affects memory retrieval. This is best illustrated by:", "o": ["Remembering a neighbor easily in their apartment hallway, but struggling to recognize them on a train.", "Being able to remember a phone number by repeating it over and over.", "Forgetting where you saved a file because you didn't use a descriptive name.", "Using a calendar to remind you of an upcoming appointment."], "a": 0, "r": "This is the exact example used in the slides to demonstrate how being \"out of context\" makes information difficult to retrieve.", "w": "B is rehearsal. C is poor encoding. D is cognitive offloading.", "f": "Cognitive Aspects, Slide 36 (Context is important)"}, {"s": "Cognitive Aspects", "q": "According to Gestalt principles, the tendency to perceive missing parts of a figure as filled in to complete it (e.g., seeing a whole circle even with gaps) is known as:", "o": ["Proximity", "Similarity", "Closure", "Continuity"], "a": 2, "r": "Closure is explicitly defined as the principle where missing parts of a figure are filled in to complete it.", "w": "A is grouping by nearness. B is grouping by same shape/color. D is perceiving continuous lines rather than random dots.", "f": "Cognitive Aspects / Human Vision, Slide 50 (Gestalt Principles) Q33. Using a physical calendar with post-it notes to remember appointments is an example of: A) Computational offloading B) Cognitive offloading C) The Gulf of Execution D) Bottom-up processing"}, {"s": "Cognitive Aspects", "q": "Erroneous mental models are often:", "o": ["Complete, highly scientific, and based on deep system knowledge.", "Poor, incomplete, easily confusable, and based on inappropriate analogies or superstition.", "Identical to the designer’s conceptual model.", "Only formed by novice users, never by experts."], "a": 1, "r": "The slides explicitly list these exact adjectives (poor, incomplete, easily confusable, based on inappropriate analogies/superstition) when describing erroneous mental models.", "w": "A and C are the opposite of the truth. D is false (experts can also have erroneous or highly specialized mental models that don't match the system).", "f": "Cognitive Aspects, Slide 74 (Erroneous Mental Models)"}, {"s": "Cognitive Aspects", "q": "The HIPS model conceptualizes the mind as:", "o": ["A distributed network of people and artifacts.", "An information processor with ordered processing stages acting upon mental representations.", "A purely emotional response system unaffected by external artifacts.", "A perfect replica of the computer's CPU and RAM."], "a": 1, "r": "The slides state the prevalent metaphor is the mind as an information processor with ordered processing stages (comparing, matching, etc.).", "w": "A describes Distributed Cognition. C is false. D is false (the slides warn that humans DON'T work exactly like computer systems).", "f": "Cognitive Aspects, Slide 90 (Information Processing / HIPS)"}, {"s": "Cognitive Aspects", "q": "If a user is trying to figure out (evaluate) what the system has actually done after attempting a task, they are navigating the:", "o": ["Gulf of Execution", "Gulf of Evaluation", "Short-Term Memory buffer", "Distributed cognition network"], "a": 1, "r": "The Gulf of Evaluation is the mental distance from the physical system to the user, specifically regarding figuring out what the system has done.", "w": "A is about figuring out how to do the task. C and D are unrelated to this specific interaction cycle.", "f": "Cognitive Aspects, Slides 83-85 (Cycles of Interaction & Gulfs)"}, {"s": "Cognitive Aspects", "q": "Which of the following is TRUE regarding top-down processing?", "o": ["It begins with raw sensory data and feeds up toward the brain.", "It is unaffected by the observer’s expectations or prior learning.", "The context in which you see a stimulus can affect your perceptual hypotheses.", "It is the primary mechanism for detecting sudden motion in the peripheral vision."], "a": 2, "r": "Top-down processing begins with expectations/knowledge, meaning context affects perceptual hypotheses (e.g., fitting a 'letter' to expectations).", "w": "A describes bottom-up processing. B is false (it is driven by expectations). D describes rod function / pre-attentive processing.", "f": "Cognitive Aspects / Human Vision, Slide 40 (Top Down Processing)"}, {"s": "Cognitive Aspects", "q": "According to the slides, why might a user repeatedly hit the button for an elevator or pedestrian crossing at least twice?", "o": ["Because the Gulf of Evaluation is too small.", "Because they have a perfect mental model of the system's timing.", "Because of an erroneous mental model thinking it will make the lights change faster or ensure the elevator arrives.", "Because of computational offloading."], "a": 2, "r": "This is the exact example given in the slides to illustrate an erroneous mental model based on superstition or inappropriate analogy.", "w": "A, B, and D are incorrect applications of cognitive concepts to this scenario.", "f": "Cognitive Aspects, Slide 74 (Erroneous Mental Models)"}, {"s": "Cognitive Aspects", "q": "Information visualizations (like treemaps or scatterplots) are designed to:", "o": ["Increase the cognitive load on the user to test their attention limits.", "Replace the need for Long-Term Memory entirely.", "Reduce cognitive load and facilitate computational offloading by allowing rapid decisions about masses of data.", "Force users to rely solely on bottom-up processing."], "a": 2, "r": "The slides state that information visualizations are designed to allow people to make sense and rapid decisions about masses of data, reducing cognitive load and facilitating offloading.", "w": "A is the opposite of the goal. B is impossible. D is incorrect (visualizations often aid top-down pattern recognition).", "f": "Cognitive Aspects, Slides 104-105 (Design Implications for External Cognition/Visualization)"}, {"s": "Cognitive Aspects", "q": "Which of the following is NOT a valid strategy for moving information from Short-Term Memory (STM) to Long-Term Memory (LTM)?", "o": ["Rehearsal (e.g., repeating a phone number).", "Associating information with cues or related concepts.", "Deliberately avoiding any connection to existing knowledge to prevent interference.", "Actively reflecting, carrying out exercises, and discussing the material."], "a": 2, "r": "The slides state that the better the relation to existing knowledge, the better the learning and LTM storage. Avoiding connections hinders LTM encoding.", "w": "A, B, and D are all explicitly recommended in the slides as effective ways to encode information into LTM.", "f": "Cognitive Aspects / Human Abilities, Slides 35, 46, 50 (Memory Processing & Semantic LTM)"}, {"s": "Interaction Design Overview", "q": "Which of the following is NOT one of the four basic activities in the interaction design process?", "o": ["Establishing requirements", "Designing alternatives", "Marketing the product", "Evaluating"], "a": 2, "r": "The slides explicitly list the four basic activities as: Establishing requirements, Designing alternatives, Prototyping, and Evaluating. Marketing is not one of them.", "w": "A, B, and D are all core activities of the interaction design lifecycle.", "f": "Chap 1 Part 1, Slide 7 (Four basic activities in Interaction Design)"}, {"s": "Interaction Design Overview", "q": "Which of the following is a \"Usability Goal\" rather than a \"User Experience (UX) Goal\"?", "o": ["Enjoyable", "Efficient to use", "Motivating", "Emotionally fulfilling"], "a": 1, "r": "\"Efficient to use\" (measured by time/number of steps) is explicitly listed under Key Usability Goals.", "w": "A, C, and D are all listed under \"Desirable aspects\" of User Experience Goals.", "f": "Chap 1 Part 1, Slides 13-14 (Key Usability goals vs. User Experience Goals)"}, {"s": "Interaction Design Overview", "q": "In the context of HCI, \"Safe to use\" primarily means:", "o": ["Protecting the system from hackers and viruses.", "Preventing the loss of user data and providing reasonable safeguards like \"Are you sure?\" prompts.", "Ensuring the hardware is physically locked to a desk.", "Guaranteeing that the software will never crash under any circumstance."], "a": 1, "r": "The slides explicitly state that \"Safe to use\" means not losing data, giving users a chance to confirm actions (e.g., \"are you sure\"), and being reliable/forgiving. It does not generally mean computer security.", "w": "A is computer security. C is physical security. D is impossible (\"Almost impossible to do perfectly\").", "f": "Chap 1 Part 1, Slide 14 (Explanation of HCI meaning for Safe to use)"}, {"s": "Interaction Design Overview", "q": "The Three Mile Island nuclear accident (1979) is cited in the slides as a catastrophic failure primarily caused by:", "o": ["A complete lack of computer technology in the control room.", "Operators intentionally ignoring safety protocols.", "A flawed user interface design where a status indicator showed the valve was commanded to close, but not its actual open state.", "The operators having perfect mental models of the system."], "a": 2, "r": "The slides detail that the control panel's status indicator only showed whether the valve was instructed to open/close, failing to convey its actual state, leading operators to mistakenly believe it was closed.", "w": "A is false (computers were present). B is false (it was a design/misinterpretation issue). D is false (they had an erroneous mental model).", "f": "Chap 1 Part 2, Slide on Three Mile Nuclear Plant Accident"}, {"s": "Interaction Design Overview", "q": "Which design principle is violated when a system has multiple commands starting with the same letter (e.g., save, spelling, select, style), forcing the use of complex key combinations like Ctrl+Shift+S?", "o": ["Feedback", "Visibility", "Consistency", "Affordance"], "a": 2, "r": "The slides explicitly use this example to show how consistency breaks down, increasing the learning burden and making users more prone to errors.", "w": "A, B, and D are unrelated to keyboard shortcut conflicts.", "f": "Chap 1 Part 2, Slide on \"When consistency breaks down\""}, {"s": "Interaction Design Overview", "q": "\"Internal consistency\" refers to:", "o": ["Designing operations to behave the same across different applications and devices.", "Designing operations to behave the same within a single application.", "Ensuring the hardware matches the software color scheme.", "Using the same font size for all text on a website."], "a": 1, "r": "Internal consistency is explicitly defined as designing operations to behave the same within an application.", "w": "A describes external consistency. C and D are not the definitions provided in the slides.", "f": "Chap 1 Part 2, Slide on Internal and external consistency"}, {"s": "Interaction Design Overview", "q": "According to Don Norman, a \"real\" affordance is:", "o": ["A visual graphic sign that helps inform the user.", "A physical attribute of an object that allows people to know how to use it.", "A learned convention of arbitrary mappings.", "A software interface element like a scrollbar."], "a": 1, "r": "The slides state Norman argues it does not make sense to talk about software interfaces in terms of 'real' affordances; for Norman, a real affordance is physical (e.g., a chair affording sitting). Software uses perceived affordances.", "w": "A describes a signifier. C describes learned conventions. D is a perceived affordance, not a real physical one.", "f": "Chap 1 Part 2, Slide on Affordances"}, {"s": "Interaction Design Overview", "q": "Which of the following is the BEST example of a \"logical constraint\" in a software interface?", "o": ["A USB-C connector that can be plugged in either way.", "A \"Copy\" menu option that is greyed out (disabled) until the user selects some text.", "A physical key that only fits into a lock one way.", "A door handle that affords pulling."], "a": 1, "r": "The slides explicitly use the example of disabling/greying out a menu option (like Copy) when it is not appropriate, allowing users to reason why it is unavailable.", "w": "A, C, and D are examples of physical constraints or affordances, not logical software constraints.", "f": "Chap 1 Part 2, Slide on Logical Constraints in HCI"}, {"s": "Interaction Design Overview", "q": "The \"Gulf of Evaluation\" is best described as:", "o": ["The mental distance from the user to the physical system (how hard it is to execute a task).", "The mental distance from the physical system to the user (the quality of communication/feedback from the system).", "The time it takes for a user to learn a new software application.", "The physical distance between the user's eyes and the monitor."], "a": 1, "r": "The Gulf of Evaluation is explicitly defined as the distance from the physical system to the user, representing the quality of communication (feedback) from the system.", "w": "A describes the Gulf of Execution. C and D are unrelated distractors.", "f": "Chap 1 Part 2 / Cognitive Aspects, Slide on Gulfs of Execution and Evaluation"}, {"s": "Interaction Design Overview", "q": "Why is the TiVo remote considered better designed than the Apex remote in the slides?", "o": ["It has more buttons to access every function instantly.", "It is peanut-shaped to fit in the hand, with commonly used buttons easy to reach and a logical, color-coded layout.", "It uses voice control exclusively.", "It is made of heavy marble to prevent it from being lost."], "a": 1, "r": "The slides explicitly list these exact features (peanut shape, logical layout, color-coded, easy-to-locate buttons) as reasons for the TiVo remote's superior design.", "w": "A is false (too many buttons is bad). C and D are not mentioned (marble was a separate conceptual answering machine example).", "f": "Chap 1 Part 1, Slide on Good and bad design (TiVo remote)"}, {"s": "Interaction Design Overview", "q": "Which of the following is an example of \"External consistency\"?", "o": ["Using Ctrl+C for copy and Ctrl+V for paste across Windows, MacOS, and Linux applications.", "Ensuring all dialog boxes within a single photo-editing app use the same \"OK\" and \"Cancel\" button placement.", "Designing a custom, unique gesture for deleting a file that only works in one specific app.", "Making the \"Save\" button red in one module and green in another module of the same app."], "a": 0, "r": "External consistency is defined as designing operations/interfaces to be the same across applications and devices.", "w": "B is internal consistency. C and D are examples of inconsistency.", "f": "Chap 1 Part 2, Slide on External consistency"}, {"s": "Interaction Design Overview", "q": "In the context of accessibility, \"inclusiveness\" is best defined as:", "o": ["Designing products specifically for people with severe visual impairments.", "A proactive approach to designing and making products that accommodate the widest possible number of people, regardless of disability, age, or income.", "Providing a separate, specialized version of a product for users with disabilities.", "Ensuring a product works only on the latest, most expensive devices."], "a": 1, "r": "The slides explicitly define inclusiveness as a proactive approach to accommodating the widest possible number of people, going beyond just disability to include age, income, etc.", "w": "A and C describe reactive or narrow accessibility approaches, not broad inclusiveness. D is the opposite of inclusiveness. Ref: Chap 1 Part 2, Slide on Accessibility and inclusiveness", "f": "Chap 1 Part 2, Slide on Accessibility and inclusiveness"}, {"s": "Interaction Design Overview", "q": "Which of the following is a \"negative\" or undesirable User Experience (UX) aspect?", "o": ["Engaging", "Provocative", "Patronizing", "Rewarding"], "a": 2, "r": "\"Patronizing\" is explicitly listed under the \"Undesirable aspects\" of UX goals in the slides.", "w": "A, B, and D are all listed under \"Desirable aspects\" of UX goals.", "f": "Chap 1 Part 1, Slide on Some key User Experience Goals"}, {"s": "Interaction Design Overview", "q": "\"Mapping\" in interaction design refers to:", "o": ["The visual layout of a website's sitemap.", "The relationship between controls and their movements/usage and the results in the world.", "The process of translating code from one programming language to another.", "The use of color to indicate system status."], "a": 1, "r": "Mapping is explicitly defined as the relationship between controls and their movements/usage and the results in the world (e.g., volume up/down).", "w": "A, C, and D are unrelated to the HCI definition of mapping.", "f": "Chap 1 Part 2, Slide on Mapping"}, {"s": "Interaction Design Overview", "q": "Why is having knobs at the top of a stove potentially safer for small children but not for adults, according to the mapping activity?", "o": ["Children are taller and can easily reach top knobs.", "Top knobs are harder for small children to reach, but adults might accidentally brush against them or find the mapping less intuitive if the knobs don't align with the burners.", "Top knobs are always color-coded, which children understand better.", "Adults prefer voice-activated stoves."], "a": 1, "r": "The slides pose this as an activity question, implying top knobs are out of children's reach (safer), but for adults, poor mapping (knobs not aligned with burners) or accidental brushing creates hazards.", "w": "A is factually incorrect (children are shorter). C and D are not supported by the slides.", "f": "Chap 1 Part 2, Slide on Mapping Activity (stove knobs)"}, {"s": "Interaction Design Overview", "q": "Which of the following is NOT a recommended design implication for managing user attention?", "o": ["Make information salient when it needs attending to.", "Avoid cluttering the interface with too much information.", "Use as many flashing lights and pop-ups as possible to ensure the user sees everything.", "Use techniques like color, ordering, spacing, and animation to make things stand out."], "a": 2, "r": "The slides explicitly warn: \"Don’t overuse attention interrupts in UI design\" and \"Avoid using too many attention-grabbing methods because the software allows it.\"", "w": "A, B, and D are all explicitly recommended design implications for attention.", "f": "Chap 1 Part 2 / Cognitive Aspects, Slide on Design implications for attention"}, {"s": "Interaction Design Overview", "q": "In the context of the slides, \"perceived affordances\" in software interfaces are necessary because:", "o": ["Software interfaces are virtual and do not have physical affordances like real-world objects.", "Users prefer not to have any visual clues about how to use a system.", "Physical affordances are illegal in software design.", "Software interfaces are always perfectly intuitive without any clues."], "a": 0, "r": "The slides state: \"Software interfaces are virtual and do not have affordances like physical objects... Instead software interfaces are better conceptualized as ‘perceived’ affordances.\"", "w": "B, C, and D are false statements contradicted by HCI principles.", "f": "Chap 1 Part 2, Slide on Affordances"}, {"s": "Interaction Design Overview", "q": "The principle of \"Visibility\" in HCI means:", "o": ["Putting as many buttons as possible on the main screen.", "Making the element/control visually seen AND making it obvious what it does (comprehensible).", "Hiding all advanced features to protect novice users.", "Ensuring the monitor has the highest possible brightness setting."], "a": 1, "r": "The slides explicitly state: \"The element/control should be visually seen AND it should be obvious what it does... Visible to the mind as well as the eye (i.e., Comprehensible).\"", "w": "A leads to clutter. C violates visibility. D is a hardware setting, not an HCI principle.", "f": "Chap 1 Part 2, Slide on Meaning of Visibility in HCI"}, {"s": "Interaction Design Overview", "q": "Which of the following is an example of a \"physical constraint\"?", "o": ["A software menu option being greyed out because no text is selected.", "A USB-A connector that can only be inserted into a port in one specific orientation.", "A tooltip that appears when hovering over an icon.", "A progress bar showing the status of a file download."], "a": 1, "r": "Physical constraints refer to the way physical objects restrict movement (e.g., only one way to insert a key or USB-A).", "w": "A is a logical constraint. C and D are forms of feedback/visibility.", "f": "Chap 1 Part 2, Slide on Physical constraints"}, {"s": "Interaction Design Overview", "q": "Which of the following is a \"negative\" User Experience (UX) goal/aspect?", "o": ["Engaging", "Provocative", "Patronizing", "Rewarding"], "a": 2, "r": "\"Patronizing\" is explicitly listed under the \"Undesirable aspects\" of UX goals in the slides.", "w": "A, B, and D are all listed under \"Desirable aspects\" of UX goals.", "f": "Chap 1 Part 1, Slide on Some key User Experience Goals Q24. What is a key characteristic of a \"user-centered approach\" to design? A) Designing the system first, then training users to adapt to it. B) Early focus on users and tasks, empirical measurement, and iterative design. C) Relying solely on the \"genius\" of the lead designer without user input. D) Prioritizing technological capabilities over user needs."}, {"s": "Interaction Design Overview", "q": "In the context of color guidelines for UI/UX, which of the following is considered a GOOD color combination?", "o": ["Yellow text on a white background.", "Red text on a blue background.", "Yellow text on a blue background.", "Green text on a red background."], "a": 2, "r": "The slides explicitly state: \"Yellow on black or blue is fine. Yellow on green or white is a no-no.\"", "w": "A is explicitly called a \"no-no\". B and D are examples of colors that can \"vibrate\" or hurt the eyes.", "f": "Chap 1 Part 2 / Cognitive Aspects, Slide on Color Guidelines"}, {"s": "Interaction Design Overview", "q": "\"Feedback\" in interaction design should ideally be:", "o": ["Delayed to prevent the user from rushing the system.", "Timely, acknowledging the action and giving feedback on what the system is doing.", "Provided only through auditory means to save screen space.", "Hidden so as not to clutter the interface."], "a": 1, "r": "The slides state feedback should be \"timely, should acknowledge action and give feedback on action the system is taking, or if it is working on something.\"", "w": "A, C, and D violate the core purpose of feedback (which is to reduce user anxiety and confirm system status).", "f": "Chap 1 Part 2, Slide on Feedback"}, {"s": "Interaction Design Overview", "q": "Which of the following best describes \"distributed cognition\"?", "o": ["Cognitive phenomena that happen exclusively inside the head of one person.", "Collective thinking concerned with cognitive phenomena across individuals, artifacts, and internal/external representations.", "The process of a computer's CPU distributing tasks to multiple cores.", "A user's ability to remember a phone number by repeating it."], "a": 1, "r": "Distributed cognition is explicitly defined as collective thinking concerned with phenomena across individuals, artifacts, and representations (Hutchins, is false (HIPS is an individual, internal model). C is computer science, not HCI. D is rehearsal in STM.", "w": "B, C, and D are not mentioned or relevant to this cognitive error.", "f": "Chap 1 Part 2 / Cognitive Aspects, Slide on Distributed cognition Q28. Why is the \"general valve theory\" (e.g., turning a thermostat to the maximum to heat a room faster) considered an erroneous mental model? A) Because thermostats are on-off switches, not valves, so turning it higher doesn't heat the room faster. B) Because valves are obsolete technology. C) Because users should never touch thermostats. D) Because it requires too much computational offloading."}, {"s": "Interaction Design Overview", "q": "Which of the following is an example of \"cognitive offloading\"?", "o": ["Using a calculator to perform a complex multiplication sum.", "Using a post-it note to remind yourself to buy milk.", "Sorting a deck of cards by suit.", "Underlining key terms in a textbook."], "a": 1, "r": "Cognitive offloading is defined as a common strategy to prevent forgetting (e.g., using diaries, reminders, post-its).", "w": "A is computational offloading. C is cognitive tracing. D is annotation.", "f": "Chap 1 Part 2 / Cognitive Aspects, Slide on Cognitive offloading"}, {"s": "Interaction Design Overview", "q": "The pulse oximeter inaccuracy for Black patients during the COVID-19 pandemic, as mentioned in the slides, highlights the importance of:", "o": ["Using only red light in medical devices.", "Adequate research and inclusive design to avoid unforeseen risks and biases in technology.", "Relying solely on visual inspection of the patient.", "Designing devices that only work in well-lit rooms."], "a": 1, "r": "The slides use this exact case study under the heading \"Inadequate Research and Bad Design can lead to Unforeseen Risks for Some\" to highlight the need for inclusive design.", "w": "A, C, and D are incorrect takeaways from the case study.", "f": "Chap 1 Part 1, Slide on Inadequate Research and Bad Design (Pulse oximeters)"}, {"s": "Interaction Design Overview", "q": "What is the primary purpose of \"constraints\" in interface design?", "o": ["To make the interface look more minimalist.", "To restrict the possible actions that can be performed, helping prevent the user from selecting incorrect options.", "To increase the learning burden on the user.", "To ensure that all menu options are always visible."], "a": 1, "r": "Constraints are explicitly defined as restricting possible actions to help prevent users from selecting incorrect or undesirable options. Why Wrong: A, C, and D are not the purposes of constraints (C is the opposite of the goal).", "w": "A, C, and D are not the purposes of constraints (C is the opposite of the goal).", "f": "Chap 1 Part 2, Slide on Constraints"}, {"s": "Interaction Design Overview", "q": "Which of the following is a \"design implication\" for perception?", "o": ["Icons should enable users to distinguish their meaning readily.", "Users should be forced to memorize complex command sequences.", "Interfaces should avoid using any borders or white space.", "Haptic feedback should be used constantly to ensure the user feels the device."], "a": 0, "r": "The slides explicitly state: \"Icons should enable users to distinguish their meaning readily\" as a design implication for perception.", "w": "B violates memory principles. C violates perception principles (borders/spacing help grouping). D is false (haptic should be used \"judiciously\").", "f": "Chap 1 Part 2 / Cognitive Aspects, Slide on Design implications (1) for perception"}, {"s": "Interaction Design Overview", "q": "In the context of the slides, \"inclusiveness\" differs from \"accessibility\" in that inclusiveness is:", "o": ["Only focused on people with permanent disabilities.", "A proactive approach to designing products that accommodate the widest possible number of people, regardless of disability, age, or income.", "A reactive approach to fixing products after they are released.", "Only applicable to hardware devices, not software."], "a": 1, "r": "The slides define inclusiveness as a \"proactive approach to providing accessibility\" that accommodates the widest possible number of people.", "w": "A describes a narrow view of accessibility. C and D are false.", "f": "Chap 1 Part 2, Slide on Accessibility and inclusiveness"}, {"s": "Interaction Design Overview", "q": "Which of the following is NOT a category of attention?", "o": ["Selective attention", "Focused attention", "Divided attention", "Distributed attention"], "a": 3, "r": "The slides list the categories of attention as: Selective, Focused, and Divided. \"Distributed\" applies to cognition, not attention.", "w": "A, B, and C are all explicitly listed as categories of attention.", "f": "Chap 1 Part 2 / Cognitive Aspects, Slide on Categories of Attention"}, {"s": "Interaction Design Overview", "q": "Why might a designer choose to grey out a menu option (like \"Copy\") instead of making it disappear entirely when it is not available?", "o": ["To save processing power.", "Because making it disappear might make the user think it is gone forever, whereas disabling it allows the user to reason why it is not available (e.g., they need to select something first).", "Because grey is the most aesthetically pleasing color.", "To violate the principle of consistency."], "a": 1, "r": "The slides explicitly state that disabling (greying out) allows users to reason why it is not available, whereas making it disappear might make them think it is gone forever.", "w": "A, C, and D are not valid HCI design reasons.", "f": "Chap 1 Part 2, Slide on Logical Constraints"}, {"s": "Interaction Design Overview", "q": "Which of the following is an example of a \"signifier\" in interaction design?", "o": ["The physical ability of a chair to support weight.", "A visual graphic sign, label, or auditory clue that helps inform the user how to use an affordance (e.g., a \"Push\" sign on a door).", "The internal code that makes a button work.", "The user's mental model of how a system works."], "a": 1, "r": "The slides define a signifier as giving \"some visual graphic sign, and/or label, and/or auditory clue that helps to inform the user how to use the affordance.\"", "w": "A is a real affordance. C is implementation detail. D is a mental model.", "f": "Chap 1 Part 2, Slide on Affordances"}, {"s": "Interaction Design Overview", "q": "According to the slides, what is a major disadvantage of heavy multitasking?", "o": ["It increases the user's short-term memory capacity.", "Heavy multitaskers are more prone to being distracted and find it difficult to filter irrelevant information.", "It allows users to perfectly divide their attention between two intensive visual sources.", "It eliminates the need for divided attention."], "a": 1, "r": "The slides cite Ophir et al. (2009), stating heavy multitaskers were more prone to being distracted and found it difficult to filter irrelevant information.", "w": "A is false (STM capacity is fixed). C is false (two visual sources are harder to combine). D is nonsensical.", "f": "Chap 1 Part 2 / Cognitive Aspects, Slide on Multitasking and attention"}, {"s": "Interaction Design Overview", "q": "The concept of \"embodied interaction\" emphasizes:", "o": ["The practical engagement with the social and physical environment, and how our bodies and active experiences shape how we perceive, feel, and think.", "The idea that the mind is purely an information processor isolated from the body.", "The use of virtual reality to replace all physical interactions.", "The strict separation of cognitive processes from physical actions."], "a": 0, "r": "Embodied interaction is explicitly defined as the practical engagement with the social/physical environment, where bodies and active experiences shape perception and thought.", "w": "B describes the outdated HIPS model. C and D are the opposites of embodied interaction.", "f": "Chap 1 Part 2 / Cognitive Aspects, Slide on Embodied Interaction"}, {"s": "Interaction Design Overview", "q": "Which of the following statements about \"recognition versus recall\" is TRUE?", "o": ["Command-based interfaces are easier to use because they rely on recognition.", "Graphical interfaces support recognition memory (e.g., browsing menus/icons), which is easier than the recall memory required by command-line interfaces.", "Humans are generally better at recall than recognition.", "Web browsers do not support recognition memory."], "a": 1, "r": "The slides explicitly state that graphical interfaces provide visually-based options that people need only browse to recognize, which is easier than recalling from memory (required by command-line interfaces).", "w": "A is false (command-line requires recall). C is false (we recognize things much better than we recall them). D is false (browser tabs/history support recognition).", "f": "Chap 1 Part 2 / Cognitive Aspects, Slide on Recognition versus recall"}, {"s": "Gathering Data", "q": "Which of the following is NOT one of the six key issues to consider when planning data gathering?", "o": ["Setting goals", "Triangulation", "Writing the final software code", "Pilot studies"], "a": 2, "r": "Writing software code is a development activity, not a data gathering issue. The six key issues are: setting goals, identifying participants, relationship with participants, ethical considerations, triangulation, and pilot studies.", "w": "A, B, and D are all explicitly listed as key issues in data gathering planning.", "f": "Chap 8 Gathering Data, Slide 3 (Six key issues)"}, {"s": "Gathering Data", "q": "\"Triangulation\" in data gathering refers to:", "o": ["Measuring the physical distance between the user and the screen.", "Investigating a phenomenon from more than one perspective, using different sources, investigators, or techniques.", "Using exactly three participants in a focus group.", "Limiting the study to only quantitative data to ensure accuracy."], "a": 1, "r": "Triangulation is explicitly defined as investigating phenomena from more than one perspective (e.g., combining quantitative experiments with qualitative interviews).", "w": "A, C, and D are made-up distractors unrelated to the research definition of triangulation.", "f": "Chap 8 Gathering Data, Slide 3 (Triangulation)"}, {"s": "Gathering Data", "q": "Which type of interview is \"tightly scripted, often like a questionnaire, and highly replicable but may lack richness\"?", "o": ["Unstructured interview", "Semi-structured interview", "Structured interview", "Ethnographic interview"], "a": 2, "r": "Structured interviews are explicitly defined in the slides as tightly scripted, replicable, but potentially lacking richness.", "w": "A is not directed by a script (rich but not replicable). B is guided by a script but allows exploration (balance of richness and replicability). D is a broader methodology, not a specific interview script type.", "f": "Chap 8 Gathering Data, Slide 5 (Interviews)"}, {"s": "Gathering Data", "q": "When designing interview questions, which of the following should be AVOIDED?", "o": ["Open questions that allow for detailed responses.", "Leading questions that make assumptions (e.g., \"Why do you dislike this feature?\").", "Probing questions that ask for clarification.", "Prompts that use screenshots to help the interviewee remember."], "a": 1, "r": "The slides explicitly warn to avoid leading questions that make assumptions, as they introduce unconscious bias.", "w": "A, C, and D are all recommended techniques for enriching the interview process and getting valid data.", "f": "Chap 8 Gathering Data, Slide 7 (Interview questions) Q5. A major advantage of focus groups is that they: A) Guarantee that every participant will speak an equal amount of time. B) Provide a diverse range of opinions from 3–10 participants in a single session. C) Are always easier to analyze than individual questionnaires. D) Eliminate the need for a moderator or facilitator."}, {"s": "Gathering Data", "q": "Which of the following is TRUE regarding Likert scales in questionnaires?", "o": ["They should always use an even number of points to force a definitive choice.", "Using an odd number of points (e.g., 3, 5, 7) allows for a neutral response in the middle.", "They are exclusively used for open-ended qualitative responses.", "They should always use biased, leading phrasing to guide the user to the \"correct\" answer."], "a": 1, "r": "The slides explicitly state to use an odd number of points if you want to have a neutral response in the middle.", "w": "A is false (even numbers force a choice, which isn't always desired). C is false (Likert scales are closed-ended rating scales). D is false (questions should be as unbiased as possible).", "f": "Chap 8 Gathering Data, Slide 22 (Likert Questions)"}, {"s": "Gathering Data", "q": "A \"pilot study\" in data gathering is best described as:", "o": ["A study conducted only by aviation professionals.", "A small trial of the main study to test equipment, questions, and procedures.", "The final, large-scale deployment of the questionnaire to thousands of users.", "A method of analyzing data after the main study is completely finished."], "a": 1, "r": "A pilot study is explicitly defined as a small trial of the main study to identify and fix issues before the full rollout.", "w": "A, C, and D are literal or procedural distractors that misrepresent the term.", "f": "Chap 8 Gathering Data, Slide 3 (Pilot studies)"}, {"s": "Gathering Data", "q": "Which of the following is an example of \"indirect observation\"?", "o": ["A researcher sitting in a room watching a user interact with a prototype.", "A researcher asking a user to \"think aloud\" while performing a task in a lab.", "Analyzing interaction logs and web analytics to track user activities remotely.", "Conducting a face-to-face semi-structured interview."], "a": 2, "r": "Indirect observation involves tracking users' activities without direct, real-time human observation, such as through diaries, interaction logs, or web analytics.", "w": "A and B are examples of direct observation in a controlled environment. D is an interview, not observation. Ref: Chap 8 Gathering Data, Slide 31 & 42 (Indirect observation)", "f": "Chap 8 Gathering Data, Slide 31 & 42 (Indirect observation)"}, {"s": "Gathering Data", "q": "Ethnography differs from simple observation primarily because it:", "o": ["Is much faster and cheaper to conduct.", "Involves the researcher immersing themselves in the culture or environment being studied over an extended period.", "Relies exclusively on quantitative data and statistical analysis.", "Does not require the cooperation of the people being observed."], "a": 1, "r": "Ethnography is defined as an in-depth study method where researchers immerse themselves in the culture they study, making heavy use of participant observation and interviews.", "w": "A is false (it is time-consuming and expensive). C is false (it is highly qualitative/interpretivist). D is false (cooperation is required).", "f": "Chap 8 Gathering Data, Slide 35 (Ethnography)"}, {"s": "Gathering Data", "q": "When structuring a framework to guide observation, the \"SPACE, ACTORS, ACTIVITIES, OBJECTS, ACTS, EVENTS, TIME, GOALS, FEELINGS\" framework is used to:", "o": ["Design the graphical user interface of the observation software.", "Provide a detailed checklist of what to look for and record during an observation.", "Calculate the statistical significance of the observed data.", "Replace the need for taking any notes during the observation."], "a": 1, "r": "This detailed framework (Robson & McCarten, 2016) is explicitly provided in the slides as a guide for what specific elements to observe and record in the field.", "w": "A, C, and D are unrelated to the purpose of an observational framework.", "f": "Chap 8 Gathering Data, Slide 32 (Structuring frameworks to guide observation)"}, {"s": "Gathering Data", "q": "Which of the following is a recognized advantage of online questionnaires?", "o": ["They completely eliminate sampling bias.", "They guarantee a 100% response rate.", "Data can be collected directly into a database, reducing time required for data analysis.", "They prevent individuals from responding more than once under any circumstances."], "a": 2, "r": "The slides list \"Data can be collected in database for analysis\" and \"Time required for data analysis is reduced\" as key advantages.", "w": "A is false (sampling can still be problematic). B is false (40% is considered good, 20% acceptable). D is false (preventing multiple responses is listed as a problem with online questionnaires).", "f": "Chap 8 Gathering Data, Slide 29 & 30 (Advantages and Problems with online questionnaires)"}, {"s": "Gathering Data", "q": "In an interview, a \"probe\" is best defined as:", "o": ["A physical device used to test hardware ergonomics.", "A device for getting more information (e.g., \"Can you tell me more about how you do X?\").", "A visual aid, like a screenshot, shown to help the interviewee remember something.", "A leading question designed to confirm the interviewer's hypothesis."], "a": 1, "r": "Probes are explicitly defined as devices for getting more information or elaboration from the interviewee.", "w": "C describes a prompt. A and D are incorrect definitions.", "f": "Chap “Devices for getting more information”"}, {"s": "Gathering Data", "q": "Why is it important to consider the composition of a focus group carefully?", "o": ["To ensure that managers and supervisors dominate the conversation to provide \"expert\" opinions.", "To ensure the group is homogenous or strategically mixed depending on the study's goals (e.g., workers only vs. a mix).", "To guarantee that everyone in the group knows each other personally beforehand.", "To ensure the group contains exactly 20 people for statistical validity."], "a": 1, "r": "The slides state that composition is important and you might want workers only, managers only, or a mix, depending on what you are trying to uncover.", "w": "A is false (domination by one group is a risk to be managed). C is not required. D is false (focus groups are typically 3–10 people).", "f": "Chap 8 Gathering Data, Slide 18 (Focus Group Interview Strategies) and storage."}, {"s": "Gathering Data", "q": "The \"Think-aloud\" technique is primarily used during:", "o": ["Indirect observation via web analytics.", "Direct observation in a controlled environment (e.g., a usability lab).", "Mass distribution of online questionnaires.", "Unstructured ethnographic field studies."], "a": 1, "r": "The slides explicitly place the \"Think-aloud\" technique under \"Direct observation in a controlled environment,\" where observers ask users to verbalize their thoughts while performing tasks.", "w": "A, C, and D are different data gathering methods where think-aloud is not the primary technique.", "f": "Chap 8 Gathering Data, Slide 34 & 41 (Direct observation in a controlled environment / Think-aloud)"}, {"s": "Gathering Data", "q": "Which of the following is FALSE regarding questionnaire design?", "o": ["The impact of a question can be influenced by the order in which questions are presented.", "You should strike a balance between using white space and keeping the questionnaire compact.", "Very long questionnaires are preferred because they gather more comprehensive data.", "You must decide whether phrases will be all positive, all negative, or mixed."], "a": 2, "r": "The slides explicitly advise to \"Avoid very long questionnaires\" to prevent participant fatigue and drop-off.", "w": "A, B, and D are all true, recommended practices for questionnaire design listed in the slides.", "f": "Chap 8 Gathering Data, Slide 20 (Questionnaire design)"}, {"s": "Gathering Data", "q": "When conducting remote interviews, a noted advantage is that:", "o": ["Participants are in their own environment and may be more relaxed.", "It is easier to observe the participant's physical workspace and artifacts directly.", "Internet connection issues never occur.", "Participants cannot leave the interview early, ensuring complete data."], "a": 0, "r": "The slides list \"Participants are in their own environment and are more relaxed\" and \"Participants don't have to travel\" as advantages of remote interviews.", "w": "B is false (remote makes physical observation harder). C is false (tech issues are a known risk). D is false (participants can leave whenever they want, which is listed as an advantage for sensitive issues).", "f": "Chap 8 Gathering Data, Slide 11 (Doing interviews remotely)"}, {"s": "Gathering Data", "q": "What is the primary purpose of \"prompts\" in an interview?", "o": ["To interrupt the user and change the subject abruptly.", "To help the interviewee remember or clarify something (e.g., showing a screenshot).", "To force the interviewee to give a specific, predetermined answer.", "To replace the need for an informed consent form."], "a": 1, "r": "Prompts are defined as devices to help the interviewee, such as showing a particular screenshot or helping them remember a name or term.", "w": "A, C, and D are incorrect and violate good interviewing practices.", "f": "Chap 8 Gathering Data, Slide 13 (Questioning techniques: Probes and prompts)"}, {"s": "Gathering Data", "q": "A good response rate for a mailed or distributed questionnaire is generally considered to be:", "o": ["100%", "80-90%", "40% (with 20% often being acceptable)", "Less than 5%"], "a": 2, "r": "The slides explicitly state: \"40% response rate is good, 20% is often acceptable.\"", "w": "A, B, and D do not match the realistic benchmarks provided in the course material.", "f": "Chap 8 Gathering Data, Slide 25 (Encouraging a good response)"}, {"s": "Gathering Data", "q": "The choice of which data gathering technique(s) to use depends on all of the following EXCEPT:", "o": ["The focus of the study.", "The resources and time available.", "The personal preference of the lead designer, regardless of the study's needs.", "The participants involved and the nature of the technique."], "a": 2, "r": "Technique selection should be driven by the study's focus, participants, resources, and time, not arbitrary personal preference.", "w": "A, B, and D are all explicitly listed in the slides as factors for choosing and combining techniques.", "f": "Chap 8 Gathering Data, Slide 44 (Choosing and combining techniques)"}, {"s": "Process of Interaction Design", "q": "The User-Centered Design (UCD) approach rests on three core principles. Which of the following is NOT one of them?", "o": ["Early focus on users and tasks.", "Empirical measurement of user reactions and performance.", "Iterative design (fixing problems and re-testing).", "Relying on the \"genius\" of the lead designer to envision the final product without user input."], "a": 3, "r": "\"Genius design\" is contrasted with UCD. UCD explicitly requires user involvement, empirical measurement, and iteration.", "w": "A, B, and C are the exact three pillars of the UCD approach listed in the slides.", "f": "Chap 9 Process of ID, Slide 6 & 23 (What is a user-centered approach? / Summary)"}, {"s": "Process of Interaction Design", "q": "In the context of involving users, \"Expectation management\" means:", "o": ["Promising the users that the final product will have every feature they request.", "Setting realistic expectations, avoiding surprises/disappointments, and providing timely training without hype.", "Hiding the project timeline from the users to prevent them from rushing the designers.", "Assuming users know exactly what is technologically possible."], "a": 1, "r": "The slides define expectation management as setting realistic expectations, no surprises, no disappointments, and timely communication without hype. Why Wrong: A is unrealistic and leads to disappointment. C and D are poor project management practices contradicted by the slides. . It allows development to start anywhere, but evaluation must follow each activity. C) It mandates a strict, linear, top-down progression from requirements to implementation with no going back. D) It is the most widely used model for large, standard, run-of-the-mill software projects.", "w": "A is unrealistic and leads to disappointment. C and D are poor project management practices contradicted by the slides. . It allows development to start anywhere, but evaluation must follow each activity. C) It mandates a strict, linear, top-down progression from requirements to implementation with no going back. D) It is the most widely used model for large, standard, run-of-the-mill software projects.", "f": "Chap 9 Process of ID, Slide 9 (The Star lifecycle model)"}, {"s": "Process of Interaction Design", "q": "According to Eason (1987), stakeholders can be categorized into three groups. Which of the following is NOT one of those categories?", "o": ["Primary users (frequent hands-on users).", "Secondary users (occasional users or those who use it via someone else).", "Tertiary stakeholders (those affected by its introduction or who influence its purchase).", "Quaternary developers (the programmers who write the backend code)."], "a": 3, "r": "Eason's three categories are primary, secondary, and tertiary stakeholders. \"Quaternary developers\" is a made-up distractor.", "w": "A, B, and C are the exact three categories defined in the slides.", "f": "Chap 9 Process of ID, Slide 14 (Who are the users/stakeholders?)"}, {"s": "Process of Interaction Design", "q": "When trying to understand user \"needs,\" the slides suggest that designers should:", "o": ["Take user requests for specific features literally and build exactly what they ask for.", "Look at existing tasks, their context, and why the task is achieved the way it is, rather than just asking users what they \"need.\"", "Assume users have a perfect understanding of what is technologically possible.", "Ignore existing behaviors and only focus on futuristic, envisioned scenarios."], "a": 1, "r": "The slides state that users rarely know what is possible and can't always articulate their needs. Instead, designers should look at existing tasks, context, and collaborations.", "w": "A, C, and D are explicitly warned against in the \"What do we mean by 'needs'?\" section.", "f": "Chap 9 Process of ID, Slide 16 (What do we mean by 'needs'?)"}, {"s": "Process of Interaction Design", "q": "\"Empirical measurement\" in the UCD approach involves:", "o": ["Guessing how users will react based on the designer's intuition.", "Observing, recording, and analyzing users' reactions and performance to scenarios, manuals, simulations, and prototypes.", "Measuring the physical weight and dimensions of the hardware device.", "Counting the number of lines of code written by the development team."], "a": 1, "r": "Empirical measurement is explicitly defined as observing, recording, and analyzing user reactions and performance to vari
