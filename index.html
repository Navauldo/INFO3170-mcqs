ous design artifacts.", "w": "A is the opposite of empirical. C and D are irrelevant metrics to UX evaluation.", "f": "Chap 9 Process of ID, Slide 6 (What is a user-centered approach?)"}, {"s": "Process of Interaction Design", "q": "Which of the following is a recognized \"Quality threshold\" used when choosing among design alternatives?", "o": ["Memorability: Can infrequent users remember how to achieve their goal?", "Aesthetic appeal to the lead developer.", "The total number of features packed into the interface.", "The speed at which the development team can write the code."], "a": 0, "r": "Memorability (along with safety, utility, effectiveness, efficiency, and learnability) is explicitly listed as a usability criterion/quality threshold to check regularly.", "w": "B, C, and D are not user-centered quality thresholds; in fact, packing in features often harms usability.", "f": "Chap 9 Process of ID, Slide 20 (How to choose among alternatives)"}, {"s": "Process of Interaction Design", "q": "The IDEO \"TechBox\" is mentioned in the slides as an example of:", "o": ["A tool for automated usability testing.", "A library, database, and website containing physical gizmos to inspire the generation of design alternatives.", "A software framework for building rapid prototypes.", "A questionnaire distribution platform."], "a": 1, "r": "The TechBox is described as a library/database of physical gizmos used to seek inspiration and generate alternatives (\"flair and creativity\").", "w": "A, C, and D misrepresent the purpose of the TechBox.", "f": "Chap 9 Process of ID, Slide 18-19 (How to generate alternatives / IDEO TechBox)"}, {"s": "Process of Interaction Design", "q": "Integrating interaction design activities with \"Agile software development\" is considered promising because Agile:", "o": ["Eliminates the need for user testing entirely.", "Stresses the importance of iteration, early/regular feedback, and handles emergent requirements.", "Enforces a strict, rigid, top-down waterfall process.", "Prioritizes technological feasibility over user needs."], "a": 1, "r": "The slides explicitly list iteration, early/regular feedback, handling emergent requirements, and balancing flexibility/structure as reasons Agile integrates well with ID.", "w": "A, C, and D are the exact opposites of Agile principles and UCD principles.", "f": "Chap 9 Process of ID, Slide 22 (How to integrate interaction design in other models)"}, {"s": "Process of Interaction Design", "q": "\"Iterative design\" means that:", "o": ["The design is finalized in one single, perfect draft before any testing occurs.", "When problems are found in user testing, they are fixed, and more tests are carried out.", "The design is handed off to the software engineering team and never revisa single, comprehensive document at the very end of the project. C) Articulating who the users are, their key tasks, and using a style guide to capture usability goals.", "Ignoring user feedback until the beta version is released."], "a": 2, "r": "The Mayhew model emphasizes a holistic view, articulating users/tasks, and using style guides to capture usability goals early on.", "w": "A is false (it's holistic and iterative). B is false (it links to software engineering but is user-centered). D violates UCD principles.", "f": "Chap 9 Process of ID, Slide 11 (Usability Engineering Lifecycle model)"}, {"s": "Process of Interaction Design", "q": "Why is \"generating alternatives\" considered a key part of the interaction design process?", "o": ["Because humans naturally stick to what they know works, so designers must actively work to \"break out of the box.\"", "Because software engineers prefer to have only one option to code.", "Because generating alternatives slows down the project, which is a legal requirement.", "Because users always know exactly which alternative is the best from the start."], "a": 0, "r": "The slides state that humans stick to what they know, so considering alternatives is important to \"break out of thebox,\" and designers are trained to do this.", "w": "B, C, and D are false statements contradicted by the design process described in the slides.", "f": "Chap 9 Process of ID, Slide 17 (How to generate alternatives)"}, {"s": "Process of Interaction Design", "q": "In the Star Lifecycle Model, why is \"Evaluation\" placed at the center?", "o": ["Because evaluation is only done once, at the very end of the project.", "Because results of each activity must be evaluated before moving on to the next one, regardless of where development started.", "Because evaluation is the cheapest and fastest activity to perform.", "Because it is mandated by international software engineering laws."], "a": 1, "r": "The slides emphasize that in the Star model, evaluation is central, and development may start anywhere, but evaluation follows each activity.", "w": "A is false (it's iterative, not one-time). C and D are made-up distractors.", "f": "Chap 9 Process of ID, Slide 9-10 (The Star lifecycle model)"}, {"s": "Process of Interaction Design", "q": "Which of the following is a practical issue designers must address when establishing requirements?", "o": ["Determining the exact hex color code for the background.", "Identifying who the users and stakeholders are, and understanding what their \"needs\" and tasks actually are.", "Writing the SQL database queries for the backend.", "Deciding which programming language the development team will use."], "a": 1, "r": "The slides list \"Who are the users?\", \"What are 'needs'?\", and \"Where do alternatives come from?\" as key practical issues in the requirements phase. Why Wrong: A, C, and D are implementation or granular design details, not high-level requirement establishment issues.", "w": "A, C, and D are implementation or granular design details, not high-level requirement establishment issues.", "f": "Chap 9 Process of ID, Slide 13 (Some practical issues)"}, {"s": "Process of Interaction Design", "q": "A \"scenario\" in interaction design is best described as:", "o": ["A formal, mathematical proof of system correctness.", "An informal, natural narrative story describing a particular or typical situation, useful prior to creating a design.", "A detailed, line-by-line code specification for the software engineers.", "A post-release marketing brochure for the end user."], "a": 1, "r": "Scenarios are explicitly defined as informal narrative stories, simple and natural, describing a typical situation, most useful prior to creating a design.", "w": "A, C, and D misrepresent the purpose and format of a design scenario.", "f": "Chap 9 Process of ID / Contextual Design, Slide on Scenarios"}, {"s": "Human Abilities", "q": "Which of the following is FALSE regarding the Human Information Processing System (HIPS) model?", "o": ["It conceptualizes human performance in metaphorical terms of information processing stages.", "It models mental activities as happening exclusively inside the head of one person at a time.", "It adequately accounts for how people interact with computers, devices, and other people in the real world.", "It is rarely used nowadays as other models (like distributed cognition) have superseded it."], "a": 2, "r": "The slides explicitly state that a major limitation of the HIPS model is that it does not adequately account for real-world interactions with devices, objects, and other people. Why Wrong: A, B, and D are all true statements about the HIPS model as described in the slides.", "w": "A, B, and D are all true statements about the HIPS model as described in the slides.", "f": "Human Abilities, Slides 4, 92-93 (Limitations of HIPS model)"}, {"s": "Human Abilities", "q": "In the context of the human motor system, complex movements are best described as:", "o": ["Random, unlearned reflexes that cannot be optimized.", "Procedures composed of sub-procedures and small elementary muscle movements.", "Processes that are always faster and more accurate than computer processing.", "Actions that should be made as hard as possible to prevent all user errors."], "a": 1, "r": "The slides state that complex movements are like procedures, composed of sub-procedures and groups of small elementary movements (e.g., walking, typing).", "w": "A is false (they are learned). C is false (computers are faster at raw computation). D is false (only safety-critical tasks should be made harder; frequent tasks should be easy).", "f": "Human Abilities, Slide 6 (Motor System)"}, {"s": "Human Abilities", "q": "Which of the following is a recommended design implication for the motor system to prevent errors?", "o": ["Make frequently performed tasks require hard, complex motor sequences to ensure user attention.", "Avoid placing buttons that perform similar tasks close to each other or moving them unexpectedly between screens.", "Encourage users to repeatedly drag items across the screen to build muscle memory.", "Provide erratic or slow system feedback to force the user to slow down."], "a": 1, "r": "The slides state that motor tasks starting with similar sequences are easily confused (e.g., OK/Cancel buttons moving), so designers should avoid this to prevent errors.", "w": "A is false (frequent tasks should be easy). C is false (repetitive dragging causes RSI). D is false (good, timely feedback is required for efficient motor tasks). and 10 (Motor System Design Principles)", "f": ""}, {"s": "Human Abilities", "q": "The Dvorak keyboard layout was designed primarily to:", "o": ["Prevent mechanical typewriter keys from jamming.", "Optimize typing speed and minimize finger movement by placing common letters on the home row under the strongest fingers.", "Alphabetize the keys so beginners can find letters easily.", "Force users to alternate hands less frequently to reduce cognitive load."], "a": 1, "r": "The slides state Dvorak was designed to optimize speed, minimize finger movement, and place the most common letters on the home row under the strongest fingers.", "w": "A describes the QWERTY layout. C describes the Alphabetic layout (which is not faster). D is false (Dvorak encourages alternating hands).", "f": "Human Abilities, Slides 30-32 (Dvorak Keyboard Design Principles)"}, {"s": "Human Abilities", "q": "Which of the following is NOT a recommended strategy for preventing Repetitive Strain Injuries (RSI)?", "o": ["Using good ergonomic hardware (e.g., split keyboards, quality trackballs).", "Taking frequent micro-breaks (e.g., 2 minutes of stretching for every 15 minutes of work).", "Using voice input or pen input to give the hands a break.", "Continuing to work through the pain to build up hand strength and endurance."], "a": 3, "r": "Continuing to work through pain exacerbates RSI and can lead to permanent damage. Prevention and rest are key.", "w": "A, B, and C are all explicitly recommended in the slides for RSI prevention and coping.", "f": "Human Abilities, Slides 42-44 (RSI Prevention and Coping)"}, {"s": "Human Abilities", "q": "Regarding Short-Term Memory (STM), which of the following statements is FALSE?", "o": ["It has a very limited capacity, often cited as 7 ± 2 items or chunks.", "Information is lost in a few seconds to a few minutes unless rehearsed.", "It acts as a permanent storage area for all our life experiences.", "Associating information with cues or pictures helps move items from STM to Long-Term Memory."], "a": 2, "r": "STM is a temporary \"scratchpad,\" not permanent storage. Long-Term Memory (LTM) is for permanent storage.", "w": "A, B, and D are all true characteristics of STM and memory processing described in the slides.", "f": "Human Abilities, Slides 47-48 (STM Characteristics)"}, {"s": "Human Abilities", "q": "Episodic Long-Term Memory (LTM) is best described as:", "o": ["Learned knowledge organized like an interconnected graph or network of related facts.", "A temporary holding area for current problem-solving plans.", "An ongoing videotape that records everything you do, organized by time and events.", "A buffer that decays within 70 to 1000 milliseconds."], "a": 2, "r": "The slides explicitly describe Episodic LTM as an \"ongoing videotape\" that is temporal and organized by time and events.", "w": "A describes Semantic LTM. B describes Working/Intermediate-Term Memory. D describes Perceptual buffers.", "f": "Human Abilities, Slide 50 (Two types of LTM)"}, {"s": "Human Abilities", "q": "Which of the following is a key UI design implication related to human memory?", "o": ["Force users to mentally compute things that the computer could easily do.", "Avoid having users remember information (like an account balance) that was shown on a previous screen.", "Rely exclusively on recall-based command-line interfaces rather than recognition-based graphical menus.", "Design interfaces that require users to memorize 15-digit unchunked phone numbers."], "a": 1, "r": "The slides explicitly state: \"Avoid having users remember information that you can display onscreen\" to reduce cognitive load.", "w": "A, C, and D all increase memory load, which violates HCI design principles. Ref: Human Abilities, Slide 58 (UI Implications related to Memory)", "f": "Human Abilities, Slide 58 (UI Implications related to Memory)"}, {"s": "Human Abilities", "q": "In the chess/dominoes memory model example, Working Memory (or Intermediate-Term Memory) is responsible for:", "o": ["Holding the permanent rules of the game learned years ago.", "Keeping track of the current game state, intermediate results, and future move plans.", "Holding the current thought or single item being recalled right this second.", "Storing the visual afterimage of the board for 1000 milliseconds."], "a": 1, "r": "Working memory acts as a cognitive scratchpad that keeps track of the problem-solving process, intermediate results, and plans.", "w": "A is LTM. C is STM. D is the visual perceptual buffer.", "f": "Human Abilities, Slides 46, 49 (Working Memory)"}, {"s": "Human Abilities", "q": "\"Chunking\" improves memory recall by:", "o": ["Increasing the absolute number of individual items STM can hold to 15.", "Grouping individual pieces of information into meaningful units (e.g., 404 894 7328 instead of 4048947328).", "Eliminating the need for Long-Term Memory entirely.", "Forcing the user to rely on recall instead of recognition."], "a": 1, "r": "The slides define a chunk as a \"meaningful grouping of information\" that helps in recall and effectively expands STM capacity.", "w": "A is false (STM capacity is fixed, but chunking packs more info per slot). C and D are false.", "f": "Human Abilities, Slide 47 (STM: Chunks)"}, {"s": "Human Abilities", "q": "Which of the following pointing devices is considered the MOST natural for freehand sketching but is generally NOT good for double-clicking?", "o": ["Ergonomic split keyboard", "Pen/stylus", "Advanced trackball with scroll ring", "Standard optical mouse"], "a": 1, "r": "The slides state that a pen/stylus is a natural pointing device best for freehand sketching, but it is hard to hit the exact same spot twice for a double-click because you lift the pen.", "w": "A is for typing. C and D are better for clicking/double-clicking but less natural for freehand sketching.", "f": "Human Abilities, Slide 22 (Pointing Device Ergonomics) “Text Neck” is caused by: A) Using a Dvorak keyboard for extended periods. B) Bending the head forward to look down at a smartphone, which can put up to 60 pounds of pressure on the spine. C) Staring at a monitor with a high refresh rate. D) Using a trackball instead of a mouse."}, {"s": "Human Abilities", "q": "Which of the following is TRUE regarding perceptual buffers?", "o": ["The visual buffer decays slowly over 3 to 5 seconds.", "The auditory buffer decays very quickly, within 70 to 1000 milliseconds.", "The visual buffer decays in 70-1000 ms, while the auditory buffer decays in 0.9-3.5 seconds.", "Perceptual buffers have unlimited capacity and do not decay."], "a": 2, "r": "The slides explicitly state the decay rates: 70-1000 ms for visual, and 0.9-3.5 seconds for auditory.", "w": "A and B have the decay rates swapped. D is false (they have limited capacity and decay quickly).", "f": "Human Abilities, Slide 59; Human Vision, Slide 2 (Perceptual buffers)"}, {"s": "Human Abilities", "q": "Why is dragging considered a \"hard\" motor task in some older UI designs (e.g., early Mac pull-down menus)?", "o": ["It requires too much cognitive reasoning.", "It can strain the hand if done very frequently and requires sustained muscle tension.", "It relies entirely on Long-Term Memory recall.", "It is impossible to perform with a trackball."], "a": 1, "r": "The slides note that dragging is a hard task with mice and can strain the hand if done frequently, which is why early Mac drag-to-select menus caused RSI for some users.", "w": "A, C, and D are incorrect (trackballs can actually make dragging easier ergonomically).", "f": "Human Abilities, Slides 10, 20 (Motor Tasks, Mouse Ergonomics)"}, {"s": "Human Abilities", "q": "Semantic Long-Term Memory (LTM) is characterized by:", "o": ["Being organized like an interconnected graph or network of related facts, concepts, and skills.", "Being highly susceptible to decay within 30 seconds without rehearsal.", "Storing only visual and auditory sensory impressions.", "Being limited to exactly 7 ± 2 items."], "a": 0, "r": "Semantic LTM is explicitly defined as learned knowledge organized like an interconnected graph or network.", "w": "B describes STM. C describes perceptual buffers. D describes STM capacity.", "f": "Human Abilities, Slide 51 (Semantic LTM)"}, {"s": "Human Abilities", "q": "Good system feedback is crucial for the motor system because:", "o": ["It allows the computer to save battery life.", "Erratic or slow feedback confuses users, making motor task procedures (like typing or mouse use) less efficient.", "It replaces the need for Long-Term Memory.", "It forces the user to switch from parallel to serial processing."], "a": 1, "r": "The slides state that good feedback is important so motor task procedures can continue efficiently; erratic/slow feedback confuses users and reduces efficiency.", "w": "A, C, and D are unrelated to the motor system's need for feedback. spacial layout of the retina, where are rods MOST densely concentrated? A) In the fovea (center of the retina). B) At about 25 degrees around the fovea. C) In the blind spot. D) Evenly distributed across the entire retina.", "f": "Human Vision, Slide 15 (Implications of Cone and Rod Distribution)"}, {"s": "Human Vision", "q": "The HSV color model, commonly used by graphic artists, stands for:", "o": ["Hue, Saturation, Value (Brightness).", "High, Standard, Vibrant.", "Hexadecimal, Shade, Variance.", "Hue, Shadow, Volume."], "a": 0, "r": "The slides explicitly define HSV as Hue (basic color/wavelength), Saturation (relative purity/intensity), and Value/Brightness (lightness or darkness).", "w": "B, C, and D are made-up acronyms.", "f": "Human Vision, Slide 29 (Specifying Color - HSV Model)"}, {"s": "Human Vision", "q": "The Gestalt principle of \"Closure\" refers to:", "o": ["The tendency for elements of the same shape or color to be seen as belonging together.", "The tendency to perceive missing parts of a figure as filled in to complete it (e.g., seeing a whole circle even with gaps).", "The tendency to perceive continuous lines rather than a random set of dots.", "The tendency to group dots that are close to each other."], "a": 1, "r": "Closure is explicitly defined as the principle where missing parts of a figure are filled in to complete it, so it appears as a whole.", "w": "A is Similarity. C is Continuity. D is Proximity.", "f": "Human Vision, Slide 50 (Gestalt Principles of Perceptual Grouping)"}, {"s": "Human Vision", "q": "Why is blinking or flashing at certain frequencies (e.g., 15-20 Hz) a significant concern in UI design?", "o": ["It drains the device battery too quickly.", "It can cause seizures in some epileptic users, as famously demonstrated by the Pokémon incident in Japan.", "It makes the screen too bright for users with normal vision.", "It violates the Gestalt principle of symmetry."], "a": 1, "r": "The slides explicitly warn that blinking at 15-20 Hz can cause seizures in some epileptics, citing the 1997 Pokémon incident where hundreds were hospitalized.", "w": "A, C, and D are not the primary safety/health concerns associated with this specific frequency range.", "f": "Human Vision, Slides 54-56 (Blinking and Epilepsy)"}, {"s": "Human Vision", "q": "According to the slides, visual comparison in an interface (e.g., judging if two objects are the exact same size or color) is:", "o": ["Always 100% reliable and should be the sole basis for critical data entry.", "Not always reliable, as the surrounding context can affect visual judgment (e.g., optical illusions).", "Faster and more accurate than computer-based comparison.", "Unaffected by the user's color vision or lighting conditions."], "a": 1, "r": "The slides explicitly state: \"Visual comparison is not always reliable in an interface... The surrounding context can affect visual judgment.\"", "w": "A, C, and D are false statements contradicted by the slides' warnings about visual perception limitations.", "f": "Human Vision, Slide 52 (Visual comparison is not always reliable) Q36. Which of the following is a recognized advantage of using a trackball over a standard mouse for certain users? A) It requires the whole hand to be moved across the desk, building arm strength. B) It requires less hand movement, making it better ergonomically for some, and dragging can be easier. C) It is universally the fastest pointing device for all users, including novices. D) It completely eliminates the need for buttons."}, {"s": "Human Vision", "q": "The \"7 ± 2\" memory phenomenon is often misapplied in interface design because:", "o": ["People cannot scan lists of more than 7 items.", "Interfaces should strictly never have more than 7 tabs or menu items.", "People can scan lists of bullets or menus for the one they want, relying on recognition rather than recall.", "Short-term memory capacity is actually unlimited if the user is highly trained."], "a": 2, "r": "The slides explicitly argue against strictly limiting interfaces to 7 items, because scanning relies on recognition, not recall, so interfaces can have more than 9 items.", "w": "A and B are the exact misconceptions the slides debunk. D is false (STM is strictly limited).", "f": "Human Abilities, Slide 47; Cognitive Aspects, Slide 41 (The 7±2 Problem)"}, {"s": "Human Vision", "q": "Which of the following is TRUE regarding the Dvorak keyboard layout?", "o": ["It was designed in the 1930s but is not used much today due to the dominance of QWERTY.", "It places the least common letters on the home row to challenge the user.", "It was designed specifically to prevent mechanical typewriter keys from jamming.", "It is proven to be slower than QWERTY for all users, including trained typists."], "a": 0, "r": "The slides state Dvorak has been around since the 1930s but is not used much because of QWERTY's dominance, though proponents claim it increases speed.", "w": "B is false (most common letters are on the home row). C describes QWERTY. D is false (proponents claim it is faster).", "f": "Human Abilities, Slides 30-31 (Dvorak Keyboard)"}, {"s": "Human Vision", "q": "In the context of color vision deficiency (color blindness), the most common form is:", "o": ["The inability to see the color blue.", "Reduced ability to differentiate between red and green.", "Complete monochromatic vision (seeing only in black and white).", "Heightened sensitivity to yellow and purple."], "a": 1, "r": "The slides explicitly state: \"Most common form of colour deficiency is reduced ability to differentiate red and green.\"", "w": "A, C, and D are not the most common forms (complete monochromatic vision is extremely rare).", "f": "Human Vision, Slide 20 (Colour Vision Deficiency)"}, {"s": "Human Vision", "q": "Which of the following is a key design implication of the narrow field of view of the cones (approx. 1-5 degrees)?", "o": ["Users can easily read and perceive fine details across the entire screen simultaneously.", "Changes and alerts appearing outside the current fixation point may be missed unless they use motion (detected by rods) to attract attention.", "Designers should use tiny, static blue fonts for critical alerts in the corners of the screen.", "The fovea covers a wide 25-degree field of view, making peripheral vision highly detailed."], "a": 1, "r": "The slides state that because the fovea (cones) has a narrow field of view, changes outside this area may be missed. Motion (detected by rods up to 25 degrees) is needed to attract attention to those areas.", "w": "A is false (we cannot see details everywhere at once). C is false (small blue fonts are hard to see). D is false (the fovea is only 1-5 degrees; rods cover 25 degrees).", "f": "Human Vision, Slides 9-10, 15 (Design Implications of Visual Field of View)"}, {"s": "Contextual Design", "q": "Contextual Design (CD) is best described as:", "o": ["A strict, top-down software engineering methodology focused solely on database design.", "A form of user-centered design ideal for medium and large systems, but scalable down to small systems.", "A rapid prototyping technique that requires no user involvement until the final testing phase.", "A purely theoretical framework with no practical diagramming methods."], "a": 1, "r": "The slides explicitly state that CD is a form of user-centered design, ideal for medium and large systems but scalable down to small systems. Why Wrong: A is false (it's user-centered, not just database-focused). C is false (it heavily involves users from the start via Contextual Inquiry). D is false (it uses specific diagramming methods like Flow, Sequence, Artifact, Cultural, and Physical models).", "w": "A is false (it's user-centered, not just database-focused). C is false (it heavily involves users from the start via Contextual Inquiry). D is false (it uses specific diagramming methods like Flow, Sequence, Artifact, Cultural, and Physical models).", "f": "Contextual Design, Slide 3 (Contextual Design)"}, {"s": "Contextual Design", "q": "Which of the following is NOT one of the four core principles of Contextual Inquiry (CI)?", "o": ["Context", "Partnership", "Interpretation", "Implementation"], "a": 3, "r": "The four principles of CI are Context, Partnership, Interpretation, and Focus. Implementation is a later software development phase, not a CI principle.", "w": "A, B, and C are all explicitly listed as core principles of Contextual Inquiry.", "f": "Contextual Design, Slide 5 (Contextual Inquiry Principles)"}, {"s": "Contextual Design", "q": "The \"Partnership\" principle in Contextual Inquiry is based on:", "o": ["The designer dictating how the work should be done to the user.", "The apprenticeship model, where the users teach the interviewer/analyst how tasks are presently done.", "A formal legal contract between the company and the software vendor.", "The assumption that the analyst already knows exactly how the user's job works."], "a": 1, "r": "The slides explicitly state that the Partnership principle is based on the apprenticeship model, where users teach the interviewer how tasks are done, which tends to make users give more information.", "w": "A, C, and D directly contradict the collaborative, learning-oriented nature of the apprenticeship model described in the slides.", "f": "Contextual Design, Slide 6 (Contextual Inquiry Principles: Partnership)"}, {"s": "Contextual Design", "q": "When applying the \"Context\" principle in a Contextual Inquiry, the interviewer should:", "o": ["Accept generalizations like \"we usually do that task this way\" to save time.", "Focus on concrete data and tasks, asking clarifying questions like \"Why are you doing this in that way?\"", "Assume they know why the user is doing something based on their own prior experience.", "Conduct the interview exclusively in a sterile, off-site conference room."], "a": 1, "r": "The slides state to go to the workplace, focus on concrete data/tasks, and ask clarifying questions. It explicitly warns not to accept generalizations or assume you know why.", "w": "A is explicitly warned against (generalizations can be misleading). C is explicitly warned against (\"Don't assume you know why\"). D contradicts the principle of going to the actual site where the task takes place.", "f": "Contextual Design, Slides 5-6 (Contextual Inquiry Principles: Context)"}, {"s": "Contextual Design", "q": "In a Contextual Design Flow Model, what does a \"lightning\" symbol represent?", "o": ["A high-speed electronic data transfer.", "A breakdown or problem in the flow of information or work.", "A mandatory safety warning for physical equipment.", "The primary trigger for a sequence of tasks."], "a": 1, "r": "The slides explicitly state to \"note breakdowns in flow – problems\" and to \"Use lightning symbol\" in Flow, Sequence, Cultural, and Physical models.", "w": "A, C, and D are made-up distractors not related to the CD notation described in the slides.", "f": "Contextual Design, Slide 10 (Constructing a Flow model)"}, {"s": "Contextual Design", "q": "A Sequence Model in Contextual Design shows:", "o": ["The organizational culture and pressures between departments.", "The physical layout of the workspace and equipment locations.", "How a single task works, including its primary intent, trigger, loops, and branches.", "The flow of physical and electronic documents between different groups of people."], "a": 2, "r": "The slides define the Sequence Model as showing how a single task works, including its trigger, loops, branches, and breakdowns.", "w": "A describes the Cultural Model. B describes the Physical Model. D describes the Flow Model.", "f": "Contextual Design, Slide 11 (Sequence Model)"}, {"s": "Contextual Design", "q": "Which of the following is TRUE regarding an Artifact Model?", "o": ["It only models digital artifacts like software screens, never physical paper.", "It shows the parts of an artifact, the data on it, and how it is used, noting any special limitations or breakdowns.", "It is identical to a UML Class Diagram and serves the exact same purpose.", "It replaces the need for any accompanying text report describing the artifact's use."], "a": 1, "r": "The slides state an Artifact Model shows the parts of an artifact, its use, and the data on it, noting special uses, limitations, or breakdowns (e.g., using post-its to supplement it).", "w": "A is false (it includes forms, bills, notes, tags, etc.). C is false (the slides explicitly state Contextual diagrams have different goals than UML). D is false (the slides state \"use of the artifact has to be fully described in the accompanying report\").", "f": "Contextual Design, Slide 13 (Artifact Models)"}, {"s": "Contextual Design", "q": "A Cultural Model in Contextual Design is primarily used to:", "o": ["Show the formal, official organizational chart of a company.", "Show the organizational culture, including interactions, influences, expectations, or pressures between people/departments.", "Map out the physical location of desks and computers in an office.", "Detail the step-by-step sequence of a single user's task."], "a": 1, "r": "The slides explicitly state the Cultural Model attempts to show the organizational culture, interactions, influences, expectations, or pressures, and that it is NOT the same as an organizational chart. Why Wrong: A is explicitly denied by the slides. C describes the Physical Model. D describes the Sequence Model.", "w": "A is explicitly denied by the slides. C describes the Physical Model. D describes the Sequence Model.", "f": "Contextual Design, Slide 15 (Cultural Model)"}, {"s": "Contextual Design", "q": "Why might a designer choose NOT to create a Cultural Model for a specific system?", "o": ["Because it is legally required to be kept secret from stakeholders.", "Because it is not feasible for some systems (to avoid offending people/factions) or not needed for simple single-user systems.", "Because Cultural Models are obsolete and have been replaced entirely by UML Use Case diagrams.", "Because it requires the designer to learn how to code in Java."], "a": 1, "r": "The slides explicitly state that Cultural Models are \"Not feasible for some systems (To avoid offending people or various factions)\" and \"Not needed for some systems (Especially single user systems)\".", "w": "A, C, and D are false statements not supported by the slides.", "f": "Contextual Design, Slide 16 (Cultural Model)"}, {"s": "Contextual Design", "q": "A Physical Model in Contextual Design shows:", "o": ["The emotional state and feelings of the users during a task.", "A labeled work/task area, its layout, locations of relevant equipment, and where information is kept.", "The abstract data flow between a server and a client database.", "The hierarchical reporting structure of the management team."], "a": 1, "r": "The slides define the Physical Model as showing a labeled work/task area, the layout, locations of relevant equipment, and areas where information is kept.", "w": "A is part of the detailed observation framework (Feelings), not the Physical Model. C is a technical system diagram. D is an organizational chart, not a Physical Model.", "f": "Contextual Design, Slide 17 (Physical Model)"}, {"s": "Contextual Design", "q": "How do Contextual Diagrams differ from UML diagrams?", "o": ["They are exactly the same and can be used interchangeably.", "Contextual diagrams are from the user's point of view, while most UML diagrams are from the system's point of view.", "UML diagrams are faster to create and require no user input, whereas Contextual diagrams require months of ethnographic study.", "Contextual diagrams only show software code structure, while UML shows user tasks."], "a": 1, "r": "The slides explicitly state: \"Contextual diagrams have different goals than UML diagrams... Most UML diagrams are from the systems point of view rather than the user.\"", "w": "A is false (they have different goals). C is false (CI is considered a faster form of ethnographic inquiry). D has the definitions completely reversed.", "f": "Contextual Design, Slide 19 (Contextual Diagrams and UML)"}, {"s": "Contextual Design", "q": "In Contextual Design, a \"Scenario\" is best defined as:", "o": ["A formal, mathematical proof of system correctness.", "An informal, natural narrative story describing a particular or typical situation, most useful prior to creating a design.", "A detailed, line-by-line code specification for the software engineers.", "A post-release marketing brochure for the end user."], "a": 1, "r": "The slides explicitly define scenarios as \"an informal narrative story, simple, 'natural', describes a particular or a typical situation. Most useful prior to creating a design\".", "w": "A, C, and D misrepresent the purpose and format of a design scenario.", "f": "Contextual Design, Slide 20 (Scenarios)"}, {"s": "Contextual Design", "q": "What is the key difference between a standard \"Use Case\" and an \"Essential Use Case\"?", "o": ["Essential Use Cases separate user intentions and system responsibilities, abstracting away specific UI details.", "Essential Use Cases are written in complex programming code, while standard Use Cases are in plain English.", "Standard Use Cases are for users, while Essential Use Cases are only for database administrators.", "There is no difference; the terms are used interchangeably in Contextual Design."], "a": 0, "r": "The slides show an example of an Essential Use Case with columns for \"USER INTENTION\" and \"SYSTEM RESPONSIBILITY\", separating the user and system components of the task.", "w": "B, C, and D are false. Essential Use Cases are abstract and technology-independent, not written in code.", "f": "Contextual Design, Slide 22 (Essential use cases)"}, {"s": "Contextual Design", "q": "Contextual Inquiry (CI) is often considered a faster alternative to:", "o": ["Agile software development.", "Ethnographic inquiry, which is often very time-consuming and expensive.", "Writing software code.", "Creating UML sequence diagrams."], "a": 1, "r": "The slides explicitly state: \"CI is often considered a faster form of ethnographic inquiry. ethnographic inquiry is often very time-consuming and expensive.\"", "w": "A, C, and D are unrelated to the specific comparison made in the slides regarding CI's speed and cost relative to ethnography.", "f": "Contextual Design, Slide 4 (Contextual Inquiry)"}, {"s": "Contextual Design", "q": "When constructing a Flow Model, what do the \"ovals\" and \"boxes\" represent, respectively?", "o": ["Ovals represent artifacts; boxes represent individuals.", "Ovals represent individuals or groups with homogenous behavior; boxes represent artifacts (documents, data, etc.).", "Ovals represent physical locations; boxes represent digital servers.", "Ovals represent system errors; boxes represent successful task completions."], "a": 1, "r": "The slides explicitly state for Flow Models: \"Ovals describe individuals involved... Boxes describe artifacts (Documents, data, etc.)\".", "w": "A has the definitions reversed. C and D are made-up distractors not found in the slides.", "f": "Contextual Design, Slide 10 (Constructing a Flow model) are the primary goals of Contextual Diagrams? A) To replace the need for software engineers by providing complete, auto-generating code. B) To show the workflow, individuals/groups, their interactions, the flow of information, and the artifacts/physical spaces used from a user point of view. C) To strictly enforce a waterfall development model with no user feedback loops. D) To document the internal database schema and SQL queries of the system."}, {"s": "Contextual Design", "q": "In a Sequence Model, a \"trigger\" is defined as:", "o": ["The person who is ultimately responsible for the task.", "An event that causes the task to be done.", "A software bug that causes the system to crash.", "The final output or report generated by the task."], "a": 1, "r": "The slides explicitly state: \"Each task has a (single) trigger. A trigger is an event that causes the task to be done.\"", "w": "A, C, and D are incorrect definitions not supported by the slides.", "f": "Contextual Design, Slide 11 (Sequence Model)"}, {"s": "Contextual Design", "q": "Why is it important to note \"breakdowns\" (problems) in Contextual Design models?", "o": ["To assign blame to specific employees for poor performance.", "Because these are often the cause of breakdowns that systems cannot handle, and understanding them informs improved future design.", "To ensure the software development team has more work to do.", "Because the lightning symbol makes the diagrams look more visually appealing."], "a": 1, "r": "The slides emphasize noting problems/breakdowns because understanding the problems with an existing system (or non-routine aspects of work) can inform improved future design.", "w": "A is contrary to the non-blaming, user-centered philosophy of CD. C and D are frivolous distractors.", "f": "Contextual20. How can Contextual Inquiry help before concrete software development begins? A) It guarantees that the software will be bug-free upon release. B) It helps ensure stakeholders, users, and the implementation team are clear on what the system will and won't do, and can form the basis for legally binding agreements. C) It allows the design team to skip the prototyping phase entirely. D) It automatically generates the final user interface code."}];
const L="ABCD",$=s=>document.querySelector(s),app=$("#app");
const secs=[...new Set(DATA.map(d=>d.s))];
let sel=new Set(secs),mode="seq",cnt=0,run=null;
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const pool=()=>DATA.filter(d=>sel.has(d.s));

function home(){
  const p=pool().length;if(!cnt||cnt>p)cnt=p;
  app.innerHTML=`<h1>HCI MCQ Practice</h1><p class="sub">Pick your sections, answer first, then see why. ${DATA.length} questions.</p>
  <div class="row"><button class="link" id="all">Select all</button><button class="link" id="none">Clear</button></div>
  <div class="secs">${secs.map(s=>`<button class="sec ${sel.has(s)?"on":""}" data-s="${s}"><span class="box"></span><b>${s}</b><small>${DATA.filter(d=>d.s==s).length} questions</small></button>`).join("")}</div>
  <div class="row"><div class="seg"><button data-m="seq" class="${mode=="seq"?"on":""}">In order</button><button data-m="rnd" class="${mode=="rnd"?"on":""}">Random</button></div>
  <label class="n">Questions <input type="number" id="cnt" min="1" max="${p||1}" value="${cnt}"> of ${p}</label></div>
  <button class="btn" id="go" ${p?"":"disabled"}>Start practice</button>
  <p class="hint">Keys during practice: A–D or 1–4 to answer, Enter or → for next.</p>`;
  app.querySelectorAll(".sec").forEach(b=>b.onclick=()=>{const s=b.dataset.s;sel.has(s)?sel.delete(s):sel.add(s);cnt=0;home()});
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;home()});
  $("#all").onclick=()=>{sel=new Set(secs);cnt=0;home()};$("#none").onclick=()=>{sel=new Set;cnt=0;home()};
  $("#cnt").onchange=e=>{cnt=Math.max(1,Math.min(p,+e.target.value||p))};
  $("#go").onclick=()=>{let q=pool();if(mode=="rnd")q=shuf(q);q=q.slice(0,Math.min(cnt||q.length,q.length));start(q)};
}
function start(q){run={q,i:0,ans:[],done:false};show()}
function show(){
  const d=run.q[run.i],n=run.q.length;
  app.innerHTML=`<div class="top"><button class="link" id="quit">Quit</button><div class="bar"><i style="width:${run.i/n*100}%"></i></div><span class="meta">${run.i+1} / ${n}</span></div>
  <div class="card"><span class="tag">${d.s}</span><p class="q">${esc(d.q)}</p>
  <div class="opts">${d.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${L[k]}</span><span><span class="t">${esc(o)}</span></span></button>`).join("")}</div></div>
  <div id="fb"></div>`;
  requestAnimationFrame(()=>{$(".bar i").style.width=(run.i/n*100)+"%"});
  $("#quit").onclick=()=>{if(confirm("Quit this session?"))home()};
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}
function answer(k){
  if(run.done)return;run.done=true;
  const d=run.q[run.i],ok=k==d.a;run.ans[run.i]=k;
  app.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;
    if(j==d.a)b.classList.add("ok");else if(j==k)b.classList.add("bad");else b.classList.add("dim")});
  const last=run.i==run.q.length-1;
  $("#fb").innerHTML=`<div class="exp"><p class="verdict ${ok?"ok":"bad"}">${ok?"Correct":"Not quite. The answer is "+L[d.a]+")"}</p>
  <h3>Why ${L[d.a]} is right</h3><p>${esc(d.r)}</p>
  ${d.w?`<h3>Why the others are wrong</h3><p>${esc(d.w)}</p>`:""}
  ${d.f?`<p class="ref">Source: ${esc(d.f)}</p>`:""}</div>
  <div class="nav"><span></span><button class="btn" id="nx">${last?"See results":"Next question"}</button></div>`;
  $("#nx").onclick=next;$("#nx").focus({preventScroll:true});
  $("#fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function next(){
  if(run.i==run.q.length-1)return results();
  run.i++;run.done=false;show();window.scrollTo({top:0,behavior:"smooth"});
}
function results(){
  const n=run.q.length,right=run.q.filter((d,i)=>run.ans[i]==d.a).length,pct=Math.round(right/n*100);
  const by={};run.q.forEach((d,i)=>{(by[d.s]??={r:0,t:0}).t++;if(run.ans[i]==d.a)by[d.s].r++});
  const missed=run.q.filter((d,i)=>run.ans[i]!=d.a);
  app.innerHTML=`<div class="card res"><h1>${pct>=80?"Strong run":pct>=50?"Getting there":"Keep practising"}</h1>
  <div class="ring"><svg width="170" height="170" viewBox="0 0 160 160"><circle class="t" cx="80" cy="80" r="70"/><circle class="f" id="rf" cx="80" cy="80" r="70"/></svg><div id="pc">0%</div></div>
  <p>${right} of ${n} correct</p>
  <div class="brk">${Object.entries(by).map(([s,v])=>`<div><span>${s}</span><div class="b"><i data-w="${v.r/v.t*100}"></i></div><em>${v.r}/${v.t}</em></div>`).join("")}</div>
  <div class="row" style="justify-content:center"><button class="btn" id="again">Retry same set</button>
  ${missed.length?`<button class="btn ghost" id="miss">Practise ${missed.length} missed</button>`:""}<button class="btn ghost" id="hm">New session</button></div></div>`;
  requestAnimationFrame(()=>{$("#rf").style.strokeDashoffset=439.8*(1-pct/100);
    app.querySelectorAll("[data-w]").forEach(e=>e.style.width=e.dataset.w+"%");
    const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1200);$("#pc").textContent=Math.round(pct*p)+"%";if(p<1)requestAnimationFrame(f)})(t0)});
  $("#again").onclick=()=>start(shuf(run.q));$("#hm").onclick=home;
  if(missed.length)$("#miss").onclick=()=>start(shuf(missed));
}
document.addEventListener("keydown",e=>{
  if(!run||!$(".opt")||e.ctrlKey||e.metaKey)return;
  const k=L.indexOf(e.key.toUpperCase()),m=+e.key-1;
  if(!run.done){const x=k>=0?k:(m>=0&&m<4?m:-1);if(x>=0)answer(x)}
  else if(e.key=="ArrowRight"||e.key=="Enter"){e.preventDefault();next()}
});
home();
</script></body></html>
